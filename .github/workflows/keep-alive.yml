# Supabase Free 플랜의 7일 자동 정지를 막는다 (#52).
#
# 정지되면 앱이 서버에 닿지 못해 열리지 않고 복구는 대시보드에서 손으로 해야 한다.
# 하필 이 앱에 나쁜 이유는 이슈에 적혀 있다 — 사용자가 며칠 쉰 바로 그 순간이 정지
# 조건이고, "다시 시작해야지" 하고 여는 순간 앱이 죽어 있다.
#
# 배포와 분리된 **별도 워크플로우**다. Vercel 은 자기 Git 연동으로 빌드하므로 이 파일이
# 실패하든 비활성화되든 배포 경로에 걸리는 것이 하나도 없다. 그래서 실패를 삼키지
# 않는다(continue-on-error 없음) — 조용히 green 인 keep-alive 는 막으려던 정지를 못 막는다.
#
# === 왜 RPC 한 방인가 ===
# 필요한 것은 "publishable key 만으로 보낼 수 있고 Postgres 에 실제로 닿는 요청" 이다.
# PostgREST 루트 `GET /rest/v1/` 는 그것이 아니다 — publishable key 로 쳐 보면 401 이고
# 본문이 이유를 그대로 말한다:
#   {"message":"Secret API key required",
#    "hint":"Only secret API keys can be used for this endpoint."}
# 비밀 키는 이 저장소가 CI 에 두지 않기로 한 물건이라 그 문은 닫혀 있다.
# `/auth/v1/health` 는 publishable key 로 200 이 오지만 Auth 가 살아 있다는 뜻일 뿐
# Postgres 를 거쳤다는 증거가 못 된다.
#
# 그래서 supabase/migrations/20260917120000_keep_alive_ping.sql 이 `keep_alive_ping()` 을
# 만들고 anon 에 execute 를 준다. 서버 시각만 돌려주고 테이블은 건드리지 않으므로
# 20260914130000 이 세운 "anon 은 이 테이블들에 볼일이 없다" 를 되돌리지 않는다.
# 후보 셋을 재 보고 고른 경위는 그 마이그레이션 머리말에 전부 적혀 있다.
#
# **이 워크플로우는 마이그레이션이 서버에 적용된 뒤에야 200 이 된다.** 적용 전에는 404 로
# 실패한다 — 그게 맞다. 적용을 잊은 채 green 인 것보다 낫다.
#
# === 예약 워크플로우 비활성화 — 이슈가 요구한 판단 ===
# 이 저장소는 PUBLIC 이고(`gh repo view --json visibility`), GitHub 문서는 이렇게 쓴다:
# "In a public repository, scheduled workflows are automatically disabled when no
# repository activity has occurred in 60 days." 걸린다.
#
# 무서운 건 **두 시계가 따로 돈다**는 점이다. GitHub 의 60일 시계가 먼저 끝나 schedule 이
# 꺼지면, 그로부터 7일쯤 뒤 Supabase 가 프로젝트를 정지시킨다. 두 시스템 어느 쪽도 그
# 사실을 앱 쪽에 알려 주지 않으므로 탐지는 사실상 "앱이 안 열린다"가 된다.
#
# 대안:
#   - 저장소 활동이 있으면 60일 시계가 초기화된다. 실질 노출은 "60일 연속 무활동".
#   - 꺼졌을 때 되살리기: Actions 탭의 Enable workflow, 또는 `gh workflow enable`.
#   - 손으로 한 번 돌리기: 아래 workflow_dispatch.
#   - 60일 무활동이 현실이 되면 근본 대안은 GitHub 밖의 cron(외부 스케줄러)으로 옮기는
#     것이다. 지금 짓지 않는다 — 아직 그 조건에 닿지 않았다.
#
# 키는 저장소에 없다. 이름은 앱·tests/policy/env.mjs 와 **같은 것을 쓴다** — 같은
# 프로젝트·같은 키를 보게 하려는 그 결정을 그대로 잇는다. 비밀 키(service_role)는 쓰지
# 않는다: 여기서 필요한 것은 요청 한 번이고, RLS 를 우회하는 키가 CI 에 있을 이유가 없다.
name: keep-alive

on:
  schedule:
    # 이틀에 한 번. 달 경계에서도 간격이 최대 2일이라 7일 창에 넉넉히 들어간다.
    - cron: '0 6 */2 * *'
  workflow_dispatch:

# 저장소에 아무것도 쓰지 않는다.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: keep_alive_ping() 호출
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          status=$(curl -sS -X POST -o /dev/null -w '%{http_code}' \
            -H "apikey: ${PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/keep_alive_ping")
          echo "HTTP ${status}"
          test "${status}" = "200"
