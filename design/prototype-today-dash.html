<!doctype html>
<!--
  PROTOTYPE — 버려질 코드. 오늘·대시보드 정보 구성 (#91, #95). 시안은 하나다(전환 바 없음).
  원칙: 탭마다 질문 하나. 오늘 = "지금 무엇을 하면 되나?", 대시보드 = "잘 되고 있나? 무엇을 손봐야 하나?"
  Q1 오늘 한 줄 = 이모지·이름, 계기, 오늘 진행, 큰 버튼. 위쪽은 날짜와 "n개 중 m개 성공"만. 시각·못 한 이유는 시트 안. XP는 토스트·축하에서만.
  Q2 지난 날 채우기 = 어제를 놓친 날에만 뜨는 배너의 "어제 채우기". 더 지난 날은 습관 상세.
  Q3 끄적이기(자유 기록) = 오늘 탭 맨 아래 작은 버튼. 떠오른 생각이나 방금 한 일. 종류 칩은 고르지 않아도 된다(기본 떠오른 생각).
  Q2' 지난 날 채우기 = 대시보드의 최근 7일 점을 눌러서. 오늘 탭엔 7일 띠를 두지 않는다.
  Q3' 탭은 두 개. 설정은 대시보드 오른쪽 위 ⚙️.
  Q4 대시보드 한 줄 = 상태등(모양 병기), 이름, 🔥 연속, 최근 7일 점, 🔴이면 "회고하기". 🔴가 맨 위.
  Q5 별·레벨·능력치 = 대시보드 맨 위 작은 카드 하나.
  Q6 자리 잡기 링·히트맵·최고 연속 = 습관 상세(한 줄을 누르면 이동. 여기선 토스트로 대신).
  고정: A 톤, 하단 탭 바, ? 툴팁, 연속 축하(평소 배너, 5일째·10일마다 팝업).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE · 오늘과 대시보드</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#E9EAEF;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;color:#15171F}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
  .phone{width:390px;max-width:100%;min-height:780px;margin:24px auto 40px;border-radius:32px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.15);background:#F4F6FB;display:flex;flex-direction:column}
  .page{flex:1;padding:28px 20px 24px}
  .date{font-size:15px;color:#6B7080;font-weight:600}
  h1{font-size:30px;margin:4px 0 14px;letter-spacing:-.02em}
  h2{font-size:17px;margin:22px 4px 10px;color:#4A4F60}
  .q{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:13px;font-weight:800;background:rgba(0,0,0,.08);color:rgba(0,0,0,.55);vertical-align:middle;margin-left:4px;flex:none}
  .pill{background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:4px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:16px}
  .muted{color:#6B7080;font-size:15px;font-weight:600}
  .cue{color:#8A90A0;font-size:14px;font-weight:600;margin-top:1px}

  .save{background:#FFF4D6;border-radius:18px;padding:14px 16px;margin-bottom:14px;color:#6A4B00}
  .save .t{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
  .save .fill{margin-top:10px;width:100%;padding:12px;border-radius:14px;background:#fff;font-size:16px;font-weight:800;color:#6A4B00;border:2px solid #F5D27A}

  .card{background:#fff;border-radius:22px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(30,40,80,.06);border:2px solid transparent}
  .card.ok{border-color:#2DBE7A}
  .ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
  .card .mid{flex:1;min-width:0}
  .card .name{font-size:19px;font-weight:800}
  .card .prog{font-size:15px;font-weight:700;color:#4A4F60;margin-top:4px}
  .bar{height:10px;border-radius:99px;background:#EEF0F5;margin-top:6px;overflow:hidden;position:relative}
  .bar i{display:block;height:100%;border-radius:99px}
  .bar b{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.25)}
  .act{width:56px;height:56px;border-radius:50%;font-size:28px;font-weight:800;color:#fff;flex:none}
  .okb{font-size:13px;font-weight:800;color:#2DBE7A}

  .feedtoggle{width:100%;padding:14px 16px;border-radius:16px;background:#fff;font-size:16px;font-weight:700;color:#4A4F60;text-align:left;display:flex;justify-content:space-between;margin-top:4px}
  .feed{background:#fff;border-radius:16px;margin-top:8px;padding:4px 16px}
  .frow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #F0F1F5;font-size:16px}

  /* 대시보드 */
  .me{background:linear-gradient(135deg,#2F6BFF,#7C5CFF);color:#fff;border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .me .lv{font-size:26px;font-weight:900}
  .me .xp{font-size:15px;font-weight:700;opacity:.9}
  .me .lvbar{height:8px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:6px;overflow:hidden}
  .me .lvbar i{display:block;height:100%;background:#fff;border-radius:9px}
  .me .q{background:rgba(255,255,255,.25);color:#fff}
  .hrow{background:#fff;border-radius:22px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(30,40,80,.06);display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
  .hrow.red{border:2px solid #F3B5AF}
  .hrow .top{display:flex;align-items:center;gap:12px}
  .light{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;padding:5px 10px;border-radius:999px;flex:none}
  .light.stable{background:#E3F6EC;color:#1E8A55}
  .light.caution{background:#FFF1D1;color:#9A6A00}
  .light.intervention{background:#FDE5E2;color:#C2392E}
  .light.personal_best{background:#FFF3C4;color:#8A6A00}
  .hrow .nm{font-size:18px;font-weight:800;flex:1;min-width:0}
  .hrow .st{font-size:15px;font-weight:800;color:#FF8A00}
  .dots{display:flex;gap:5px;align-items:center}
  .dots i{width:36px;height:36px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:800}
  .dots .ok{color:#fff}
  .dots .partial{border:2px solid;background:#fff}
  .dots .missed{background:#FBE9E7;color:#D0574C}
  .dots .skip{background:#EEF0F5;color:#8A90A0}
  .dots .pending{border:2px dashed #C9CEDA;font-size:11px;color:#9AA0AE}
  .dots .partial{font-size:13px}
  .dots .lbl{font-size:12px;color:#9AA0AE;font-weight:700;margin-right:2px}
  .reflect{width:100%;padding:12px;border-radius:14px;background:#E5534B;color:#fff;font-size:16px;font-weight:800}
  .newh{width:100%;margin-top:6px;padding:14px;border-radius:16px;border:2px dashed #D5D9E4;font-size:16px;font-weight:700;color:#6B7080}

  .tabbar{position:sticky;bottom:0;display:flex;background:#fff;border-top:1px solid #E6E8EF;padding:4px 0 8px}
  .tabbar button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:#9AA0AE}
  .tabbar button span{font-size:24px;filter:grayscale(1);opacity:.6}
  .tabbar button.on{color:#2F6BFF}
  .tabbar button.on span{filter:none;opacity:1}

  /* 시트·모달·토스트·툴팁 */
  .scrim{position:fixed;inset:0;background:rgba(20,20,30,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:390px;max-width:100%;background:#fff;border-radius:28px 28px 0 0;padding:24px 20px 40px;z-index:51;animation:up .25s}
  @keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
  .sheet h3{margin:0;font-size:22px;display:flex;align-items:center;gap:8px}
  .when{display:inline-block;background:#FFF4D6;color:#6A4B00;border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700;margin-top:8px}
  .stepper{display:flex;align-items:center;justify-content:center;gap:20px;margin:22px 0 8px}
  .stepper button{width:56px;height:56px;border-radius:50%;background:#F0F2F7;font-size:28px;font-weight:700}
  .stepper .n{font-size:48px;font-weight:800;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}
  .hintline{text-align:center;color:#6B7080;font-size:15px;font-weight:600;margin-bottom:14px}
  .timechip{display:flex;justify-content:center;margin-bottom:14px}
  .timechip button,.timechip input{font-size:15px;font-weight:700;color:#4A4F60;background:#F0F2F7;border-radius:999px;padding:8px 14px;border:0;font-family:inherit}
  .go{width:100%;padding:18px;border-radius:18px;font-size:18px;font-weight:800;color:#fff}
  .skipb{width:100%;padding:14px;font-size:15px;color:#888;margin-top:6px}
  .types{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
  .types button{padding:10px 14px;border-radius:999px;background:#F0F2F7;font-size:15px;font-weight:700}
  .types button.on{background:#2F6BFF;color:#fff}
  textarea{width:100%;min-height:96px;border-radius:16px;border:2px solid #E6E8EF;padding:12px;font-size:16px;font-family:inherit;margin-bottom:14px;resize:none}
  .modal{background:#fff;border-radius:24px;padding:24px;max-width:340px;width:100%}
  .modal h3{margin:0 0 12px;font-size:20px}
  .modal .chips{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .modal .chips button{padding:14px;border-radius:14px;background:#F2F3F7;font-size:16px;font-weight:600;text-align:left}
  .modal .cancel{width:100%;padding:12px;font-size:15px;color:#777}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1E1F26;color:#fff;padding:14px 20px;border-radius:16px;font-size:16px;font-weight:600;z-index:40;white-space:nowrap}
  .tip{position:fixed;z-index:70;max-width:260px;background:#1E1F26;color:#fff;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;display:none}
  .tip b{display:block;margin-bottom:2px}

  /* 연속 축하 */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:65}
  #fx .click{pointer-events:auto}
  .wk{display:flex;gap:6px;justify-content:center}
  .wk div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#B0A08A}
  .wk i{width:26px;height:26px;border-radius:50%;background:#F1EBE2;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:#fff}
  .wk .on i{background:#FF9600}
  .wk .today{color:#FF8A00}
  .wk .today i{animation:pop2 .5s .6s both}
  @keyframes pop2{0%{transform:scale(0);background:#F1EBE2}70%{transform:scale(1.3)}100%{transform:scale(1);background:#FF9600}}
  .bump{animation:bump .4s}
  @keyframes bump{50%{transform:scale(1.4)}}
  .pt{position:fixed;font-size:22px;left:0;top:0;animation:fly 1.1s cubic-bezier(.15,.7,.4,1) forwards}
  @keyframes fly{0%{transform:translate(var(--x),var(--y)) scale(.4);opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(1) rotate(var(--r));opacity:0}}
  .fx1{position:fixed;inset:0;background:rgba(20,20,30,.35);display:flex;align-items:center;justify-content:center}
  .fx1 .c{background:#fff;border-radius:28px;padding:24px 26px 20px;width:300px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:popin .45s cubic-bezier(.2,1.5,.4,1)}
  @keyframes popin{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .fl{font-size:64px;line-height:1;animation:flicker 1.2s ease-in-out infinite}
  @keyframes flicker{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.08) rotate(3deg)}}
  .fx1 .n{font-size:56px;font-weight:900;color:#FF8A00;line-height:1.1;display:inline-block}
  .fx1 .l,.fx3 .l{font-size:20px;font-weight:900;color:#3A2A10}
  .fx1 .s,.fx3 .s{font-size:15px;font-weight:600;color:#7A6040;margin:4px 0 14px}
  .fx1 .drain{height:4px;border-radius:9px;background:#FFE3C2;margin-top:16px;overflow:hidden}
  .fx1 .drain i{display:block;height:100%;background:#FF9600;animation:drain 3s linear forwards}
  @keyframes drain{from{width:100%}to{width:0}}
  .fx3{position:fixed;top:10px;left:50%;width:360px;max-width:calc(100% - 20px);background:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 12px 36px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px;animation:drop 3.4s cubic-bezier(.2,1.2,.4,1) forwards}
  @keyframes drop{0%{transform:translate(-50%,-140%)}12%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-140%)}}
  .fx3 .fl{font-size:40px}
  .fx3 .l b{color:#FF8A00;display:inline-block}
  .fx3 .s{margin:0}
</style>
</head>
<body>
<div id="root"></div>
<div id="tip" class="tip" role="tooltip"></div>
<div id="fx"></div>
<script>
// ── 데이터: 최근 7일(0 = 6일 전, 6 = 오늘). 오늘은 7월 8일 화요일 ───────────────
const DAYS = ['수','목','금','토','일','월','화'], TODAY = 6, YESTERDAY = 5;
const COLORS = { read:'#3B82F6', pullup:'#F97316', meditate:'#8B5CF6' };
// light 는 진단 결과(도메인 deriveStatusLight). 프로토타입에선 고정값. 🔴만 회고를 요구한다.
let S = {
  xp: 180, lv: 3, lvNext: 500,
  habits: [
    { id:'read', name:'독서', em:'📖', unit:'쪽', floor:10, target:15, cue:'자기 전 침대에서', light:'caution',
      days:[{amt:0},{amt:4},{amt:10},{amt:12},{amt:10},{amt:16},{amt:6}] },
    { id:'pullup', name:'턱걸이', em:'💪', unit:'회', floor:5, target:10, cue:'출근 전 철봉 앞에서', light:'personal_best',
      days:[{amt:5},{amt:6},{amt:0,skip:'시간이 없었어요'},{amt:5},{amt:7},{amt:5},{amt:5}] },
    { id:'meditate', name:'명상', em:'🧘', binary:true, floor:1, unit:'', cue:'아침 커피 마신 뒤', light:'intervention',
      days:[{amt:1},{amt:0},{amt:1},{amt:0},{amt:1},{amt:0},{amt:0}] },
  ],
  feed: [
    { t:'09:40', name:'📖 독서', amt:'+6쪽' },
    { t:'07:10', name:'💪 턱걸이', amt:'+5회' },
  ],
  tab:'today', sheet:null, modal:null, toast:null, feedOpen:false, clock: 14*60+20,
};
const H = id => S.habits.find(h => h.id === id);
function st(h, i){
  const d = h.days[i];
  if (d.skip) return 'skip';
  if (h.target && d.amt >= h.target) return 'over';
  if (d.amt >= h.floor) return 'done';
  if (d.amt > 0) return 'partial';
  return i === TODAY ? 'pending' : 'missed';
}
const ok = (h, i) => ['done','over'].includes(st(h, i));
function streak(h){
  let i = ok(h, TODAY) ? TODAY : TODAY - 1, n = 0;
  while (i >= 0 && ok(h, i)) { n++; i--; }
  return i < 0 ? n + 3 : n;   // 7일을 꽉 채우면 그 앞 기록이 3일 더 있다고 친다
}
const LIGHT = {
  intervention: ['🔴', '손봐야 해요'], caution: ['🟡', '살펴보세요'], stable: ['🟢', '괜찮아요'], personal_best: ['⭐', '최고 기록'],
};
const ORDER = { intervention: 0, caution: 1, stable: 2, personal_best: 3 };

// ── 툴팁 ─────────────────────────────────────────────────────────
const HELP = {
  floor: ['성공 기준', '이만큼만 하면 그날은 성공이에요. 일부러 아주 작게 잡아요.'],
  save: ['어제를 놓쳤을 때', '하루 놓치는 건 괜찮아요. 이틀 연속 놓치지 않는 게 중요해요. 어제 했는데 기록만 못 했다면 지금 채우세요.'],
  diary: ['끄적이기', '떠오른 생각이나 방금 한 일을 가볍게 적어요. 점수나 연속과는 상관없어요.'],
  lv: ['레벨과 별', '기록하면 별을 받아요. 별이 쌓이면 레벨이 올라요.'],
  light: ['상태등', '최근 기록을 보고 습관 상태를 알려 줘요. 🔴이면 설계를 다시 볼 때예요. 회고에서 무엇이 막혔는지 같이 찾아요.'],
  dots: ['최근 7일', '색이 찬 동그라미는 성공, 테두리만 있으면 조금 함, ✕는 기록 없음, –는 쉰 날이에요. 눌러서 그날 기록을 채울 수 있어요.'],
};
const q = k => `<button class="q" data-help="${k}" aria-label="설명 보기">?</button>`;
let tipFor = null;
function showTip(b){
  const [t, p] = HELP[b.dataset.help], el = document.getElementById('tip');
  el.innerHTML = `<b>${t}</b>${p}`; el.style.display = 'block';
  const r = b.getBoundingClientRect(), w = el.offsetWidth, hh = el.offsetHeight;
  el.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  el.style.top = (r.bottom + 8 + hh > innerHeight ? r.top - hh - 8 : r.bottom + 8) + 'px';
  tipFor = b;
}
function hideTip(){ document.getElementById('tip').style.display = 'none'; tipFor = null; }
document.addEventListener('mouseover', e => { const b = e.target.closest('[data-help]'); if (b && b !== tipFor) showTip(b); });
document.addEventListener('mouseout', e => { const b = e.target.closest('[data-help]'); if (b && !b.contains(e.relatedTarget)) hideTip(); });
addEventListener('scroll', hideTip, true);

// ── 기록 (메모리) ────────────────────────────────────────────────
const hhmm = m => `${String(Math.floor(m / 60)).padStart(2,'0')}:${String(m % 60).padStart(2,'0')}`;
function log(id, i, amount, time){
  const h = H(id), d = h.days[i], before = d.amt, after = before + amount;
  const crossed = before < h.floor && after >= h.floor, from = streak(h);
  d.amt = after; delete d.skip;
  const xp = crossed ? 60 : after >= h.floor ? 12 : 0; S.xp += xp;
  if (i === TODAY) S.feed.unshift({ t: time ?? hhmm(S.clock), name: `${h.em} ${h.name}`, amt: h.binary ? '했음' : `+${amount}${h.unit}` });
  S.sheet = null;
  if (crossed && i === TODAY) return { h, from, to: streak(h) };
  toast(i === TODAY ? `기록했어요${xp ? ` · +${xp} ⭐` : ` · ${after}/${h.floor}${h.unit}`}` : `${i === YESTERDAY ? '어제' : `${DAYS[i]}요일`} 기록을 채웠어요${streak(h) ? ` · 🔥 ${streak(h)}일 연속` : ''}`);
}
function skip(id, i, reason){ const h = H(id); h.days[i] = { amt: 0, skip: reason }; S.modal = null; toast('괜찮아요. 내일 다시 해요'); }
function toast(m){ S.toast = m; clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 2200); }

// ── 오늘 탭 ──────────────────────────────────────────────────────
function today(){
  const n = S.habits.filter(h => ok(h, TODAY)).length;
  const missed = S.habits.find(h => st(h, YESTERDAY) === 'missed' && !ok(h, TODAY));
  return `<div class="date">7월 8일 화요일</div><h1>오늘 할 일</h1>
  <span class="pill">✅ ${S.habits.length}개 중 ${n}개 성공</span>
  ${missed ? `<div class="save"><div class="t">🌙 <span style="flex:1">어제 ${missed.name}을 놓쳤어요. 오늘 하면 이어져요.</span>${q('save')}</div>
    <button class="fill" data-open="${missed.id}" data-day="${YESTERDAY}">어제 했어요 · 채우기</button></div>` : ''}
  ${S.habits.map(h => { const c = COLORS[h.id], s = st(h, TODAY), d = h.days[TODAY];
    const pct = Math.min(100, d.amt / (h.target ?? h.floor) * 100);
    const prog = s === 'skip' ? '오늘은 쉬어요' : h.binary ? (ok(h, TODAY) ? '했어요' : '아직 안 했어요') : `${d.amt} / ${h.floor}${h.unit}${s === 'over' ? ' · 보너스까지!' : ''}`;
    return `<div class="card ${ok(h, TODAY) ? 'ok' : ''}"><div class="ico" style="background:${c}1F">${h.em}</div>
      <div class="mid"><div class="name">${h.name} ${ok(h, TODAY) ? '<span class="okb">✓ 성공</span>' : ''}</div><div class="cue">${h.cue}</div>
      <div class="prog">${prog}</div>
      ${h.binary ? '' : `<div class="bar"><i style="width:${pct}%;background:${c}"></i>${h.target ? `<b style="left:${h.floor / h.target * 100}%"></b>` : ''}</div>`}</div>
      <button class="act" style="background:${ok(h, TODAY) ? '#2DBE7A' : c}" data-open="${h.id}" data-day="${TODAY}" aria-label="${h.name} 기록">${ok(h, TODAY) ? '✓' : '+'}</button></div>`; }).join('')}
  <button class="feedtoggle" data-feed>오늘 기록 ${S.feed.length}개 <span>${S.feedOpen ? '▴' : '▾'}</span></button>
  ${S.feedOpen ? `<div class="feed">${S.feed.map(f => `<div class="frow"><span class="t">${f.t}</span><span>${f.name}</span><span class="amt">${f.amt}</span></div>`).join('')}</div>` : ''}
  <button class="diary" data-diary>✏️ 끄적이기</button>`;
}

// ── 대시보드 탭 ──────────────────────────────────────────────────
function dots(h){
  return `<div class="dots">${h.days.map((d, i) => { const s = st(h, i), c = COLORS[h.id];
    const cls = ok(h, i) ? 'ok' : s;
    const style = ok(h, i) ? `background:${c}` : s === 'partial' ? `border-color:${c}` : '';
    const lab = ok(h, i) ? '✓' : s === 'missed' ? '✕' : s === 'skip' ? '–' : '';
    return `<button style="padding:0" data-open="${h.id}" data-day="${i}" aria-label="${h.name} ${DAYS[i]}요일"><i class="${cls}" style="${style}">${lab || (i === TODAY ? '오늘' : DAYS[i])}</i></button>`; }).join('')}${q('dots')}</div>`;
}
function dash(){
  const sorted = [...S.habits].sort((a, b) => ORDER[a.light] - ORDER[b.light]);
  const red = sorted.filter(h => h.light === 'intervention').length;
  return `<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="date">7월 8일 화요일</div><h1>대시보드</h1></div><button data-settings aria-label="설정" style="font-size:26px;width:48px;height:48px">⚙️</button></div>
  <div class="me"><div class="lv">Lv.${S.lv}</div><div style="flex:1"><div class="xp">⭐ ${S.xp} / ${S.lvNext}</div><div class="lvbar"><i style="width:${S.xp / S.lvNext * 100}%"></i></div></div>${q('lv')}</div>
  <h2>${red ? `손볼 습관 ${red}개` : '모두 괜찮아요'} ${q('light')}</h2>
  ${sorted.map(h => { const [g, w] = LIGHT[h.light];
    return `<div class="hrow ${h.light === 'intervention' ? 'red' : ''}">
      <button class="top" data-detail="${h.id}" style="text-align:left"><span class="light ${h.light}">${g} ${w}</span><span class="nm">${h.em} ${h.name}</span><span class="st">🔥 ${streak(h)}</span></button>
      ${dots(h)}
      ${h.light === 'intervention' ? `<button class="reflect" data-reflect="${h.id}">회고하기 →</button>` : ''}</div>`; }).join('')}
  <button class="newh" data-new>+ 습관 만들기</button>`;
}

// ── 시트 / 모달 ──────────────────────────────────────────────────
function sheet(){
  if (!S.sheet) return '';
  if (S.sheet.diary) {
    const types = ['💭 떠오른 생각','👍 잘한 일','🌤 기분','📝 메모'];
    return `<div class="scrim" data-close></div><div class="sheet"><h3>✏️ 끄적이기 ${q('diary')}</h3>
      <div class="types">${types.map(t => `<button class="${S.sheet.type === t ? 'on' : ''}" data-dtype="${t}">${t}</button>`).join('')}</div>
      <textarea id="dtext" placeholder="떠오른 생각이나 방금 한 일을 적어요"></textarea>
      <button class="go" style="background:#2F6BFF" data-dsave>적기</button></div>`;
  }
  const h = H(S.sheet.id), i = S.sheet.day, c = COLORS[h.id], d = h.days[i], past = i !== TODAY;
  const dayName = i === YESTERDAY ? '어제' : `${DAYS[i]}요일`;
  const when = past ? `<span class="when">${dayName} 기록 채우기</span>` : '';
  const time = past ? '' : `<div class="timechip">${S.sheet.editTime ? `<input type="time" id="tm" value="${hhmm(S.clock)}">` : `<button data-time>🕑 지금 ${hhmm(S.clock)} · 바꾸기</button>`}</div>`;
  const skipB = `<button class="skipb" data-skipask="${h.id}" data-day="${i}">${past ? '그날은' : '오늘은'} 못 했어요</button>`;
  if (h.binary) return `<div class="scrim" data-close></div><div class="sheet"><h3>${h.em} ${h.name}</h3>${when}
    <div class="hintline" style="margin:22px 0 14px">${past ? `${dayName}` : '오늘'} 했나요?</div>${time}
    <button class="go" style="background:${c}" data-log="${h.id}" data-day="${i}" data-n="1">네, 했어요!</button>${skipB}</div>`;
  const n = S.sheet.n, after = d.amt + n;
  const line = h.target && after >= h.target ? '보너스 목표까지 넘어요 ⭐' : after >= h.floor ? '이걸로 성공이에요 ✓' : `성공까지 ${h.floor - after}${h.unit} 남아요`;
  return `<div class="scrim" data-close></div><div class="sheet"><h3>${h.em} ${h.name} <span style="font-size:15px;color:#888;font-weight:600">지금 ${d.amt}${h.unit}</span></h3>${when}
    <div class="stepper"><button data-step="-1">−</button><span class="n">${n}<small style="font-size:20px">${h.unit}</small></span><button data-step="1">+</button></div>
    <div class="hintline">${line} ${q('floor')}</div>${time}
    <button class="go" style="background:${c}" data-log="${h.id}" data-day="${i}" data-n="${n}">기록하기</button>${skipB}</div>`;
}
function modal(){
  if (!S.modal) return '';
  const h = H(S.modal.id);
  return `<div class="scrim" data-close><div class="modal" onclick="event.stopPropagation()"><h3>${h.em} 못 한 이유</h3>
    <div class="chips">${['시간이 없었어요','깜빡했어요','너무 힘들었어요','쉬는 날이에요'].map(r => `<button data-skip="${h.id}" data-day="${S.modal.day}" data-reason="${r}">${r}</button>`).join('')}</div>
    <button class="cancel" data-close>취소</button></div></div>`;
}

// ── 연속 축하 (결정됨) ───────────────────────────────────────────
function weekDots(to){
  return `<div class="wk">${DAYS.map((d, i) => `<div class="${i === TODAY ? 'today on' : i >= TODAY - (to - 1) ? 'on' : ''}"><i>${i >= TODAY - (to - 1) ? '✓' : ''}</i>${d}</div>`).join('')}</div>`;
}
function add(html){ const w = document.createElement('div'); w.innerHTML = html; const el = w.firstElementChild; document.getElementById('fx').append(el); return el; }
function burst(x, y, n, spread){
  const set = ['🎉','✨','🟧','🟨','🔥','⭐'];
  for (let k = 0; k < n; k++) { const a = Math.random() * Math.PI * 2, d = spread * (.5 + Math.random() * .7);
    const el = add(`<span class="pt">${set[k % set.length]}</span>`);
    el.style.cssText += `--x:${x - 11}px;--y:${y - 11}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;--r:${Math.random() * 360}deg`;
    setTimeout(() => el.remove(), 1200); }
}
function bumpNum(el, to, ms){ setTimeout(() => { if (!el.isConnected) return; el.textContent = to; el.classList.add('bump'); }, ms); }
function celebrate(c){
  const sub = `${c.h.em} ${c.h.name} 오늘 몫 완료`;
  if (c.to === 5 || c.to % 10 === 0) {
    const el = add(`<div class="fx1 click"><div class="c"><div class="fl">🔥</div><div><span class="n">${c.from}</span></div>
      <div class="l">일 연속 성공!</div><div class="s">${sub}</div>${weekDots(c.to)}<div class="drain"><i></i></div></div></div>`);
    el.addEventListener('click', () => el.remove());
    bumpNum(el.querySelector('.n'), c.to, 600);
    setTimeout(() => burst(innerWidth / 2, innerHeight / 2, 28, 200), 250);
    setTimeout(() => el.remove(), 3000);
  } else {
    const el = add(`<div class="fx3 click"><div style="display:flex;align-items:center;gap:12px"><div class="fl">🔥</div><div><div class="l"><b>${c.from}</b>일 연속 성공!</div><div class="s">${sub}</div></div></div>${weekDots(c.to)}</div>`);
    el.addEventListener('click', () => el.remove());
    bumpNum(el.querySelector('b'), c.to, 700);
    setTimeout(() => burst(innerWidth / 2, 60, 18, 160), 300);
    setTimeout(() => el.remove(), 3400);
  }
}

// ── 렌더 ─────────────────────────────────────────────────────────
function tabbar(){
  return `<nav class="tabbar">${[['today','📅','오늘'],['dash','📊','대시보드']].map(([k, em, l]) =>
    `<button class="${S.tab === k ? 'on' : ''}" data-tab="${k}"><span>${em}</span>${l}</button>`).join('')}</nav>`;
}
function render(){
  hideTip();
  document.getElementById('root').innerHTML = `<div class="phone"><div class="page">${S.tab === 'today' ? today() : dash()}</div>${tabbar()}</div>`
    + sheet() + modal() + (S.toast ? `<div class="toast">${S.toast}</div>` : '');
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-close]');
  if (!t?.dataset.help) hideTip();
  if (!t) return;
  const d = t.dataset;
  if (d.help) return showTip(t);
  if (d.tab) S.tab = d.tab;
  else if (d.open) { const h = H(d.open), i = +d.day;
    if (h.binary && ok(h, i)) toast('이미 했어요 ✓');
    else S.sheet = { id: h.id, day: i, n: h.binary ? 1 : Math.max(1, h.floor - h.days[i].amt) }; }
  else if (d.step) S.sheet.n = Math.max(1, S.sheet.n + +d.step);
  else if (d.time !== undefined) S.sheet.editTime = true;
  else if (d.log) { const c = log(d.log, +d.day, +d.n, document.getElementById('tm')?.value); render(); if (c) celebrate(c); return; }
  else if (d.skipask) { S.modal = { id: d.skipask, day: +d.day }; S.sheet = null; }
  else if (d.skip) skip(d.skip, +d.day, d.reason);
  else if (d.feed !== undefined) S.feedOpen = !S.feedOpen;
  else if (d.diary !== undefined) S.sheet = { diary: true, type: '💭 떠오른 생각' };
  else if (d.dtype) { S.sheet.type = d.dtype; const v = document.getElementById('dtext').value; render(); document.getElementById('dtext').value = v; return; }
  else if (d.dsave !== undefined) { const v = document.getElementById('dtext').value.trim();
    S.feed.unshift({ t: hhmm(S.clock), name: S.sheet.type, amt: v || '(내용 없음)' }); S.sheet = null; toast('적어 뒀어요'); }
  else if (d.detail) toast(`PROTOTYPE · ${H(d.detail).name} 상세로 이동`);
  else if (d.reflect) toast(`PROTOTYPE · ${H(d.reflect).name} 회고 화면으로`);
  else if (d.new !== undefined) toast('PROTOTYPE · 습관 만들기로 이동');
  else if (d.settings !== undefined) toast('PROTOTYPE · 설정(테마, 로그아웃)');
  else if (d.close !== undefined) { S.modal = null; S.sheet = null; }
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideTip(); S.modal = S.sheet = null; document.getElementById('fx').innerHTML = ''; render(); } });
render();
</script>
</body>
</html>
