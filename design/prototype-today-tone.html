<!doctype html>
<!--
  PROTOTYPE — 버려질 코드. 톤 시안 비교 (#90).
  오늘 화면 하나를 구조가 다른 세 가지 톤으로 그린다. ?variant=A|B|C 또는 아래 바/←→ 키로 전환.
  원칙: 화면에는 핵심 정보만, 설명은 ? 버튼 → 모달. 데이터는 메모리에만 있다(새로고침하면 초기화).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE · 오늘 화면 톤 시안</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#E9EAEF;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .phone{width:390px;max-width:100%;min-height:780px;margin:24px auto 110px;border-radius:32px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.15)}
  .q{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:13px;font-weight:800;background:rgba(0,0,0,.08);color:rgba(0,0,0,.55);vertical-align:middle;margin-left:4px;flex:none}

  /* 공용: 모달, 토스트, 스위처 */
  .scrim{position:fixed;inset:0;background:rgba(20,20,30,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .modal{background:#fff;border-radius:24px;padding:24px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal h3{margin:0 0 10px;font-size:20px}
  .modal p{margin:0 0 20px;font-size:16px;line-height:1.6;color:#444}
  .modal .ok{width:100%;padding:14px;border-radius:14px;background:#2F6BFF;color:#fff;font-size:17px;font-weight:700}
  .modal .chips{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .modal .chips button{padding:14px;border-radius:14px;background:#F2F3F7;font-size:16px;font-weight:600;text-align:left}
  .modal .cancel{width:100%;padding:12px;font-size:15px;color:#777}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1E1F26;color:#fff;padding:14px 20px;border-radius:16px;font-size:16px;font-weight:600;z-index:40;white-space:nowrap;animation:pop .3s}
  @keyframes pop{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .switcher{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:999px;padding:6px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:14px}
  .switcher button{color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px}
  .switcher button:hover{background:#333}
  .switcher span{min-width:190px;text-align:center;font-weight:600}
  .switcher small{display:block;font-size:10px;opacity:.6;font-weight:500;letter-spacing:.08em}

  /* ───── A · 체크리스트 (깨끗한 컬러) ───── */
  .vA{background:#F4F6FB;padding:28px 20px 40px;color:#15171F}
  .vA .date{font-size:15px;color:#6B7080;font-weight:600}
  .vA h1{font-size:30px;margin:4px 0 16px;letter-spacing:-.02em}
  .vA .sumrow{display:flex;gap:8px;margin-bottom:18px}
  .vA .pill{background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:4px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .vA .save{background:#FFF4D6;border-radius:18px;padding:14px 16px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:16px;color:#6A4B00}
  .vA .card{background:#fff;border-radius:22px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(30,40,80,.06);border:2px solid transparent}
  .vA .card.ok{border-color:#2DBE7A}
  .vA .ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
  .vA .mid{flex:1;min-width:0}
  .vA .name{font-size:19px;font-weight:800}
  .vA .meta{font-size:15px;color:#6B7080;margin-top:2px;font-weight:600}
  .vA .bar{height:10px;border-radius:99px;background:#EEF0F5;margin-top:8px;overflow:hidden;position:relative}
  .vA .bar i{display:block;height:100%;border-radius:99px}
  .vA .bar b{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.25)}
  .vA .act{width:56px;height:56px;border-radius:50%;font-size:28px;font-weight:800;color:#fff;flex:none}
  .vA .act.done{background:#2DBE7A!important}
  .vA .badge{font-size:13px;font-weight:800;color:#2DBE7A}
  .vA .feedtoggle{width:100%;padding:14px;border-radius:16px;background:#fff;font-size:16px;font-weight:700;color:#4A4F60;margin-top:8px;text-align:left;display:flex;justify-content:space-between}
  .vA .feed{background:#fff;border-radius:16px;margin-top:8px;padding:4px 16px}
  .vA .frow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #F0F1F5;font-size:16px}
  .vA .frow:last-child{border:0}
  .vA .frow .t{color:#9AA0AE;font-variant-numeric:tabular-nums;width:46px}
  .vA .frow .amt{margin-left:auto;font-weight:800}
  .vA .sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:390px;max-width:100%;background:#fff;border-radius:28px 28px 0 0;padding:24px 20px 100px;z-index:51;animation:up .25s}
  @keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
  .vA-sheet h3{margin:0;font-size:22px;display:flex;align-items:center;gap:8px}
  .stepper{display:flex;align-items:center;justify-content:center;gap:20px;margin:24px 0 8px}
  .stepper button{width:56px;height:56px;border-radius:50%;background:#F0F2F7;font-size:28px;font-weight:700}
  .stepper .n{font-size:48px;font-weight:800;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}
  .sheet .hintline{text-align:center;color:#6B7080;font-size:15px;font-weight:600;margin-bottom:20px}
  .sheet .go{width:100%;padding:18px;border-radius:18px;font-size:18px;font-weight:800;color:#fff}
  .sheet .skip{width:100%;padding:14px;font-size:15px;color:#888;margin-top:6px}

  /* ───── B · 게임 (밝고 통통) ───── */
  .vB{background:#fff;padding:20px 18px 40px;color:#3C3C3C}
  .vB .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .vB .stat{display:flex;align-items:center;gap:4px;font-size:20px;font-weight:900}
  .vB .stat.fire{color:#FF9600}.vB .stat.star{color:#FFC800}.vB .stat.goal{color:#1CB0F6}
  .vB h1{font-size:28px;font-weight:900;margin:0 0 4px;color:#3C3C3C}
  .vB .lead{font-size:17px;color:#777;font-weight:700;margin-bottom:16px}
  .vB .save{border:3px solid #FFC800;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:18px;font-size:16px;font-weight:800;background:#FFFBEA}
  .vB .save .em{font-size:34px}
  .vB .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .vB .tile{border:3px solid #E5E5E5;border-bottom-width:6px;border-radius:22px;padding:14px 12px;text-align:center;position:relative;background:#fff}
  .vB .tile.ok{border-color:#58CC02;background:#F1FFE4}
  .vB .tile .em{font-size:40px;line-height:1}
  .vB .tile .nm{font-size:18px;font-weight:900;margin:6px 0 8px}
  .vB .ring{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
  .vB .ring div{width:66px;height:66px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;font-size:18px}
  .vB .ring small{font-size:11px;color:#999;font-weight:800}
  .vB .chunky{width:100%;padding:12px 8px;border-radius:16px;font-size:17px;font-weight:900;color:#fff;border-bottom:5px solid rgba(0,0,0,.2);text-transform:uppercase}
  .vB .chunky:active{transform:translateY(3px);border-bottom-width:2px}
  .vB .tile .q{position:absolute;top:8px;right:8px}
  .vB .done-tag{font-size:17px;font-weight:900;color:#58CC02;padding:12px 0}
  .vB h2{font-size:20px;font-weight:900;margin:26px 0 10px}
  .vB .chips{display:flex;flex-wrap:wrap;gap:8px}
  .vB .chip{border:2px solid #E5E5E5;border-radius:14px;padding:8px 12px;font-size:15px;font-weight:800}
  .vB .party{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:45;pointer-events:none}
  .vB-party{background:#fff;border-radius:28px;padding:28px 36px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:bounce .5s;pointer-events:auto}
  .vB-party .big{font-size:64px}
  .vB-party .t{font-size:24px;font-weight:900;color:#58CC02;margin:6px 0}
  .vB-party .x{font-size:20px;font-weight:900;color:#FFC800}
  @keyframes bounce{0%{transform:scale(.4)}60%{transform:scale(1.1)}100%{transform:scale(1)}}

  /* ───── C · 한 번에 하나 (포커스) ───── */
  .vC{min-height:780px;padding:24px 22px 40px;color:#1A1A2E;transition:background .4s}
  .vC .dots{display:flex;justify-content:center;gap:12px;margin-bottom:8px}
  .vC .dot{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.6);font-size:26px;display:flex;align-items:center;justify-content:center;position:relative;border:3px solid transparent}
  .vC .dot.on{border-color:#1A1A2E;background:#fff}
  .vC .dot .ck{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:#2DBE7A;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .vC .date{text-align:center;font-size:15px;font-weight:700;opacity:.6;margin-bottom:20px}
  .vC .hero{background:#fff;border-radius:32px;padding:28px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  .vC .hero .em{font-size:72px;line-height:1}
  .vC .hero .nm{font-size:30px;font-weight:900;margin:10px 0 4px}
  .vC .hero .st{font-size:17px;font-weight:700;opacity:.65}
  .vC .save{background:#FFF4D6;color:#6A4B00;border-radius:14px;padding:10px 12px;font-size:15px;font-weight:700;margin:14px 0 0;display:flex;align-items:center;gap:6px;justify-content:center}
  .vC .big{width:100%;padding:22px;border-radius:24px;font-size:22px;font-weight:900;color:#fff;margin-top:22px}
  .vC .rule{margin-top:14px;font-size:16px;font-weight:700;color:#555;display:flex;align-items:center;justify-content:center;gap:2px}
  .vC .later{margin-top:6px;font-size:15px;color:#999;padding:8px}
  .vC .meter{height:14px;border-radius:99px;background:#EEF0F5;margin:18px 0 0;overflow:hidden;position:relative}
  .vC .meter i{display:block;height:100%;border-radius:99px;transition:width .3s}
  .vC .meter b{position:absolute;top:0;bottom:0;width:3px;background:rgba(0,0,0,.3)}
  .vC h2{font-size:17px;margin:28px 4px 10px;opacity:.7}
  .vC .tl{display:flex;flex-direction:column;gap:8px}
  .vC .tl div{background:rgba(255,255,255,.75);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600;display:flex;gap:10px}
  .vC .tl .t{opacity:.5;font-variant-numeric:tabular-nums}
  .vC .tl .amt{margin-left:auto;font-weight:900}
  .vC .alldone{text-align:center;padding:30px 0}
  .vC .alldone .em{font-size:80px}
  .vC .alldone h3{font-size:26px;margin:8px 0}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ── 데이터 (기존 아트보드 Today.logic.js 의 예시) ──────────────────────────
const COLORS = { read:'#3B82F6', pullup:'#F97316', meditate:'#8B5CF6' };
const B_COLORS = { read:'#1CB0F6', pullup:'#FF9600', meditate:'#CE82FF' };
const C_BG = { read:'#DCEBFF', pullup:'#FFE6D2', meditate:'#EDE3FF' };
let S = {
  xp: 180,
  habits: [
    { id:'read', name:'독서', em:'📖', unit:'쪽', floor:10, target:15, done:6, streak:12 },
    { id:'pullup', name:'턱걸이', em:'💪', unit:'회', floor:5, target:10, done:5, streak:4 },
    { id:'meditate', name:'명상', em:'🧘', binary:true, floor:1, done:0, streak:0, missedYesterday:true },
  ],
  feed: [
    { t:'09:40', name:'📖 독서', amt:'+6쪽' },
    { t:'08:25', name:'🌤 기분', amt:'아침 공기가 좋았다' },
    { t:'07:10', name:'💪 턱걸이', amt:'+5회' },
  ],
  modal: null, sheet: null, toast: null, party: null, feedOpen: false, focus: null, stage: 0, clock: 14*60+20,
};
const H = id => S.habits.find(h => h.id === id);
const state = h => h.skipped ? 'skip' : h.done >= (h.target ?? Infinity) ? 'over' : h.done >= h.floor ? 'done' : h.done > 0 ? 'partial' : 'todo';
const ok = h => ['done','over'].includes(state(h));
const doneCount = () => S.habits.filter(ok).length;

// ── ? 모달 설명 ────────────────────────────────────────────────────
const HELP = {
  floor: ['성공 기준', '이만큼만 하면 오늘은 성공이에요. 일부러 아주 작게 잡아요. 못 할 수가 없을 만큼요.'],
  target: ['보너스 목표', '넘기면 별을 더 받아요. 못 넘겨도 실패가 아니에요.'],
  xp: ['별 ⭐', '기록하면 받는 점수예요. 성공 기준을 넘기면 많이, 보너스 목표를 넘기면 더 받아요.'],
  streak: ['연속 🔥', '성공한 날이 며칠째 이어지는지예요.'],
  save: ['어제를 놓쳤을 때', '하루 놓치는 건 괜찮아요. 이틀 연속으로 놓치지 않는 게 중요해요. 오늘 하면 흐름이 이어져요. 어제 기록은 습관 화면에서 채워 넣을 수 있어요.'],
  partial: ['조금 했어요', '성공 기준엔 못 미쳤지만 실패가 아니에요. 오늘 나타났다는 것도 기록돼요.'],
  feed: ['오늘 한 일', '오늘 남긴 기록이 시간 순서로 보여요. 눌러서 고치거나 지울 수 있어요.'],
};
const q = key => `<button class="q" data-help="${key}" aria-label="설명 보기">?</button>`;

// ── 기록 동작 (메모리만) ───────────────────────────────────────────
function clock(){ const m = S.clock; S.clock += 7; return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
function log(id, amount){
  const h = H(id), before = h.done, after = before + amount;
  let xp = 0;
  if (before < h.floor && after >= h.floor) xp += 60;
  if (h.target && before < h.target && after >= h.target) xp += 60;
  if (xp === 0 && before >= h.floor) xp += 12;
  h.done = after; h.skipped = false; S.xp += xp;
  S.feed.unshift({ t: clock(), name: `${h.em} ${h.name}`, amt: h.binary ? '했음' : `+${amount}${h.unit}` });
  const msg = after < h.floor ? `기록했어요 · ${after}/${h.floor}${h.unit}` : xp ? `잘했어요! +${xp} ⭐` : '기록했어요';
  if (variant() === 'B' && xp >= 60) S.party = { em: h.em, title: after >= (h.target ?? Infinity) ? '보너스 달성!' : '성공!', xp };
  else toast(msg);
  S.sheet = null;
}
function skip(id, reason){
  const h = H(id); h.skipped = true;
  S.feed.unshift({ t: clock(), name: `${h.em} ${h.name}`, amt: `못 함 · ${reason}` });
  S.modal = null; S.sheet = null; toast('괜찮아요. 내일 다시 해요');
}
function toast(m){ S.toast = m; clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 2200); }

// ── A · 체크리스트 ────────────────────────────────────────────────
function A(){
  const cards = S.habits.map(h => {
    const c = COLORS[h.id], st = state(h);
    const pct = Math.min(100, h.done / (h.target ?? h.floor) * 100);
    const floorPos = h.target ? h.floor / h.target * 100 : null;
    const meta = st === 'skip' ? '오늘은 쉬어요'
      : h.binary ? (ok(h) ? '했어요' : '아직 안 했어요')
      : `${h.done} / ${h.floor}${h.unit}` + (st === 'over' ? ' · 보너스까지!' : '');
    return `<div class="card ${ok(h) ? 'ok' : ''}">
      <div class="ico" style="background:${c}1F">${h.em}</div>
      <div class="mid">
        <div class="name">${h.name} ${ok(h) ? '<span class="badge">✓ 성공</span>' : ''}</div>
        <div class="meta">${meta} ${st === 'partial' ? q('partial') : ''}</div>
        ${h.binary ? '' : `<div class="bar"><i style="width:${pct}%;background:${c}"></i>${floorPos ? `<b style="left:${floorPos}%"></b>` : ''}</div>`}
      </div>
      <button class="act ${ok(h) ? 'done' : ''}" style="background:${c}" data-open="${h.id}" aria-label="${h.name} 기록">${ok(h) ? '✓' : '+'}</button>
    </div>`;
  }).join('');
  const med = H('meditate');
  return `<div class="vA">
    <div class="date">7월 8일 화요일</div>
    <h1>오늘 할 일</h1>
    <div class="sumrow">
      <div class="pill">✅ ${doneCount()} / ${S.habits.length} 성공</div>
      <div class="pill">⭐ ${S.xp} ${q('xp')}</div>
    </div>
    ${med.missedYesterday && !ok(med) ? `<div class="save">🌙 <span style="flex:1">어제 명상을 놓쳤어요. 오늘 하면 이어져요.</span>${q('save')}</div>` : ''}
    ${cards}
    <button class="feedtoggle" data-feed>오늘 기록 ${S.feed.length}개 <span>${S.feedOpen ? '▴' : '▾'}</span></button>
    ${S.feedOpen ? `<div class="feed">${S.feed.map(f => `<div class="frow"><span class="t">${f.t}</span><span>${f.name}</span><span class="amt">${f.amt}</span></div>`).join('')}</div>` : ''}
  </div>`;
}
function ASheet(){
  const h = H(S.sheet.id), c = COLORS[h.id];
  if (h.binary) return `<div class="scrim" data-close></div><div class="sheet vA-sheet">
    <h3>${h.em} ${h.name}</h3>
    <div class="hintline" style="margin:24px 0">오늘 했나요?</div>
    <button class="go" style="background:${c}" data-log="${h.id}" data-n="1">네, 했어요!</button>
    <button class="skip" data-skipask="${h.id}">오늘은 못 해요</button></div>`;
  const n = S.sheet.n, after = h.done + n;
  const line = after >= h.target ? '보너스 목표까지 넘어요 ⭐' : after >= h.floor ? '이걸로 오늘 성공이에요 ✓' : `성공까지 ${h.floor - after}${h.unit} 남아요`;
  return `<div class="scrim" data-close></div><div class="sheet vA-sheet">
    <h3>${h.em} ${h.name} <span style="font-size:15px;color:#888;font-weight:600">지금 ${h.done}${h.unit}</span></h3>
    <div class="stepper"><button data-step="-1">−</button><span class="n">${n}<small style="font-size:20px">${h.unit}</small></span><button data-step="1">+</button></div>
    <div class="hintline">${line} ${q('floor')}</div>
    <button class="go" style="background:${c}" data-log="${h.id}" data-n="${n}">기록하기</button>
    <button class="skip" data-skipask="${h.id}">오늘은 못 해요</button></div>`;
}

// ── B · 게임 ─────────────────────────────────────────────────────
function ring(h, c){
  const pct = Math.min(100, h.done / (h.target ?? h.floor) * 100);
  return `<div class="ring" style="background:conic-gradient(${c} ${pct}%, #EEE 0)"><div>${h.binary ? (ok(h) ? '✓' : '0/1') : `${h.done}/${h.floor}`}<small>${h.binary ? '' : h.unit}</small></div></div>`;
}
function B(){
  const best = Math.max(...S.habits.map(h => h.streak));
  const tiles = S.habits.map(h => {
    const c = B_COLORS[h.id], st = state(h);
    const quick = h.binary ? 1 : Math.max(1, h.floor - h.done) || h.floor;
    return `<div class="tile ${ok(h) ? 'ok' : ''}">
      ${st === 'partial' ? q('partial') : q('floor')}
      <div class="em">${h.em}</div><div class="nm">${h.name}</div>
      ${ring(h, ok(h) ? '#58CC02' : c)}
      ${st === 'skip' ? '<div class="done-tag" style="color:#999">쉬는 날</div>'
        : ok(h) && (h.binary || st === 'over') ? '<div class="done-tag">완료! 🎉</div>'
        : `<button class="chunky" style="background:${ok(h) ? '#58CC02' : c}" data-log="${h.id}" data-n="${quick}">${h.binary ? '했어요' : `+${quick}${h.unit}`}</button>`}
    </div>`;
  }).join('');
  const med = H('meditate');
  return `<div class="vB">
    <div class="top">
      <div class="stat fire">🔥 ${best} ${q('streak')}</div>
      <div class="stat star">⭐ ${S.xp} ${q('xp')}</div>
      <div class="stat goal">🎯 ${doneCount()}/${S.habits.length}</div>
    </div>
    <h1>오늘의 퀘스트</h1>
    <div class="lead">${doneCount() === S.habits.length ? '오늘 퀘스트를 모두 깼어요!' : `${S.habits.length - doneCount()}개만 더 하면 오늘 끝!`}</div>
    ${med.missedYesterday && !ok(med) ? `<div class="save"><span class="em">🧘</span><span style="flex:1">어제 명상을 놓쳤어요!<br>오늘 하면 흐름이 이어져요</span>${q('save')}</div>` : ''}
    <div class="grid">${tiles}<div class="tile" style="border-style:dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#AAA"><div class="em">📝</div><div class="nm" style="color:#AAA">한 줄 일기</div></div></div>
    <h2>오늘 한 일</h2>
    <div class="chips">${S.feed.map(f => `<span class="chip">${f.name} ${f.amt}</span>`).join('')}</div>
  </div>
  ${S.party ? `<div class="party" data-party><div class="vB-party"><div class="big">${S.party.em}</div><div class="t">${S.party.title}</div><div class="x">+${S.party.xp} ⭐</div><button class="chunky" style="background:#58CC02;margin-top:16px" data-party>계속</button></div></div>` : ''}`;
}

// ── C · 한 번에 하나 ──────────────────────────────────────────────
function C(){
  const next = S.habits.find(h => !ok(h) && !h.skipped);
  if (S.focus == null) S.focus = (next ?? S.habits[0]).id;
  const h = H(S.focus), c = COLORS[h.id], st = state(h);
  const dots = S.habits.map(x => `<button class="dot ${x.id === h.id ? 'on' : ''}" data-focus="${x.id}" aria-label="${x.name}">${x.em}${ok(x) ? '<span class="ck">✓</span>' : ''}</button>`).join('');
  const amount = h.binary ? 1 : Math.max(h.floor - h.done, 1);
  const pct = Math.min(100, h.done / (h.target ?? h.floor) * 100);
  const status = st === 'skip' ? '오늘은 쉬어요' : ok(h) ? (st === 'over' ? '보너스까지 했어요 ⭐' : '오늘 성공! ✓') : h.binary ? '아직 안 했어요' : `${h.done}${h.unit} 했어요`;
  const allDone = !next;
  return `<div class="vC" style="background:${C_BG[h.id]}">
    <div class="dots">${dots}</div>
    <div class="date">7월 8일 화요일 · ⭐ ${S.xp} ${q('xp')}</div>
    ${allDone && ok(h) && S.stage ? `<div class="hero alldone"><div class="em">🎉</div><h3>오늘 다 했어요!</h3><div class="st">내일 또 만나요</div></div>` : `
    <div class="hero">
      <div class="em">${h.em}</div>
      <div class="nm">${h.name}</div>
      <div class="st">${status}</div>
      ${h.binary ? '' : `<div class="meter"><i style="width:${pct}%;background:${ok(h) ? '#2DBE7A' : c}"></i>${h.target ? `<b style="left:${h.floor / h.target * 100}%"></b>` : ''}</div>`}
      ${h.missedYesterday && !ok(h) ? `<div class="save">🌙 어제 놓쳤어요. 오늘 하면 이어져요 ${q('save')}</div>` : ''}
      ${st === 'skip' ? '' : ok(h) && (h.binary || st === 'over')
        ? `<button class="big" style="background:#2DBE7A" data-next>다음 습관 →</button>`
        : `<button class="big" style="background:${c}" data-log="${h.id}" data-n="${ok(h) ? h.target - h.done : amount}">${h.binary ? '했어요!' : ok(h) ? `보너스까지 +${h.target - h.done}${h.unit}` : `+${amount}${h.unit} 하면 성공`}</button>`}
      ${h.binary ? '' : `<div class="rule">${h.floor}${h.unit}면 성공 ${q('floor')} · ${h.target}${h.unit}면 보너스 ${q('target')}</div>`}
      ${ok(h) || st === 'skip' ? '' : `<button class="later" data-skipask="${h.id}">오늘은 못 해요</button>`}
    </div>`}
    <h2>오늘 한 일 ${q('feed')}</h2>
    <div class="tl">${S.feed.map(f => `<div><span class="t">${f.t}</span><span>${f.name}</span><span class="amt">${f.amt}</span></div>`).join('')}</div>
  </div>`;
}

// ── 공용 렌더 + 스위처 ────────────────────────────────────────────
const VARIANTS = { A:'체크리스트 · 깨끗한 컬러', B:'게임 · 밝고 통통', C:'한 번에 하나 · 포커스' };
const KEYS = Object.keys(VARIANTS);
function variant(){ const v = new URLSearchParams(location.search).get('variant'); return KEYS.includes(v) ? v : 'A'; }
function setVariant(v){ const u = new URL(location); u.searchParams.set('variant', v); history.replaceState(null, '', u); S.sheet = S.modal = S.party = null; render(); }
function cycle(d){ const i = KEYS.indexOf(variant()); setVariant(KEYS[(i + d + KEYS.length) % KEYS.length]); }

function modal(){
  if (!S.modal) return '';
  if (S.modal.skip) {
    const h = H(S.modal.skip);
    return `<div class="scrim" data-close><div class="modal" onclick="event.stopPropagation()"><h3>${h.em} 오늘 못 하는 이유</h3>
      <div class="chips">${['시간이 없었어요','깜빡했어요','너무 힘들었어요','쉬는 날이에요'].map(r => `<button data-skip="${h.id}" data-reason="${r}">${r}</button>`).join('')}</div>
      <button class="cancel" data-close>취소</button></div></div>`;
  }
  const [t, p] = HELP[S.modal.help];
  return `<div class="scrim" data-close><div class="modal" onclick="event.stopPropagation()"><h3>${t}</h3><p>${p}</p><button class="ok" data-close>알겠어요</button></div></div>`;
}
function render(){
  const v = variant();
  document.getElementById('root').innerHTML =
    `<div class="phone">${v === 'A' ? A() : v === 'B' ? B() : C()}</div>`
    + (v === 'A' && S.sheet ? ASheet() : '')
    + modal()
    + (S.toast ? `<div class="toast">${S.toast}</div>` : '')
    + `<div class="switcher"><button data-cycle="-1" aria-label="이전 시안">‹</button><span><small>PROTOTYPE · ←/→</small>${v} · ${VARIANTS[v]}</span><button data-cycle="1" aria-label="다음 시안">›</button></div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-close],[data-party]'); if (!t) return;
  const d = t.dataset;
  if (d.cycle) return cycle(+d.cycle);
  if (d.help) S.modal = { help: d.help };
  else if (d.skipask) { S.sheet = null; S.modal = { skip: d.skipask }; }
  else if (d.skip) skip(d.skip, d.reason);
  else if (d.open) { const h = H(d.open); S.sheet = { id: h.id, n: h.binary ? 1 : Math.max(1, h.floor - h.done) }; }
  else if (d.step) S.sheet.n = Math.max(1, S.sheet.n + +d.step);
  else if (d.log) { log(d.log, +d.n); if (variant() === 'C') { S.stage = 1; } }
  else if (d.focus) S.focus = d.focus;
  else if (d.next) { const n = S.habits.find(h => !ok(h) && !h.skipped); if (n) S.focus = n.id; }
  else if (d.feed !== undefined) S.feedOpen = !S.feedOpen;
  else if (d.party !== undefined) S.party = null;
  else if (d.close !== undefined) { S.modal = null; S.sheet = null; }
  render();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
  if (e.key === 'Escape') { S.modal = S.sheet = S.party = null; render(); }
});
render();
</script>
</body>
