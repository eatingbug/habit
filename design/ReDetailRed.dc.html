  <style>
/* 리디자인 토큰 (#89). 라이트 #96, 다크 #98. fill은 두 테마 공통이다. */
:root, [data-theme="light"]{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface2:#F0F2F7; --inset:#EEF0F5;
  --text:#15171F; --muted:#4A4F60; --faint:#9AA0AE;
  --border:#E6E8EF; --border-strong:#8A90A0; --scrim:rgba(20,20,30,.45);
  --accent-ink:#1746B8; --accent-tint:#E8F0FF;
  --done-ink:#0B6B3E; --done-tint:#E3F6EC;
  --crit-ink:#A82A20; --crit-tint:#FDE5E2;
  --warn-ink:#6A4B00; --warn-tint:#FFF4D6;
  --streak-ink:#8F4200; --streak-tint:#FFF0E0;
  --stat-ink:#5B3FD0; --stat-tint:#EFEAFF;
  --shadow:0 2px 8px rgba(30,40,80,.06); --lift:0 12px 36px rgba(0,0,0,.18); --edge:transparent;
}
[data-theme="dark"]{
  --bg:#0F1117; --surface:#181B23; --surface2:#1F232D; --inset:#232733;
  --text:#F2F4F8; --muted:#B4BAC8; --faint:#6B7180;
  --border:#2C313D; --border-strong:#6B7282; --scrim:rgba(0,0,0,.6);
  --accent-ink:#8AB4FF; --accent-tint:#1B2A4A;
  --done-ink:#5FD99A; --done-tint:#14301F;
  --crit-ink:#FF8A80; --crit-tint:#3A1A1A;
  --warn-ink:#FFCF5C; --warn-tint:#352A0A;
  --streak-ink:#FFA45C; --streak-tint:#3A2412;
  --stat-ink:#A894FF; --stat-tint:#261F45;
  --shadow:none; --lift:none; --edge:var(--border);
}
:root{
  --accent:#2563EB; --done:#1FA463; --over:#12804B; --crit:#D93A30; --warn:#F5B000; --streak:#D96400;
  --r-sm:12px; --r-md:16px; --r-lg:22px;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg)}
[data-theme]{background:var(--bg); color:var(--text); font-family:var(--sans); font-size:17px; line-height:1.5;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; min-height:100vh}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}

/* 글씨 단계: label 14 · body 17 · title 20 · headline 24 · display 30 · number 44 */
.t-label{font-size:14px; font-weight:700; line-height:1.4}
.t-body{font-size:17px; font-weight:400}
.t-title{font-size:20px; font-weight:800; line-height:1.25}
.t-head{font-size:24px; font-weight:800; line-height:1.25}
.t-display{font-size:30px; font-weight:800; line-height:1.25; letter-spacing:-.02em; margin:0}
.t-number{font-size:44px; font-weight:900; line-height:1}
.muted{color:var(--muted)}
.b{font-weight:600}

/* 화면 틀 */
.screen{position:relative; width:390px; background:var(--bg); display:flex; flex-direction:column; overflow:hidden}
.page{flex:1; padding:24px 20px 28px; display:flex; flex-direction:column; gap:12px}
.row{display:flex; align-items:center; gap:10px}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px}
.grow{flex:1; min-width:0}
.ic{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}
.iconbtn{width:48px; height:48px; border-radius:var(--r-sm); display:inline-flex; align-items:center; justify-content:center; color:var(--muted); flex:none}
.q{position:relative; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); flex:none; vertical-align:middle}
.q .ic{width:20px; height:20px}
.q::after{content:""; position:absolute; inset:-8px}
.head-line{display:flex; align-items:center; gap:2px; margin:12px 0 0}

.tabbar{display:flex; background:var(--surface); border-top:1px solid var(--border); padding:4px 0 10px}
.tabbar button{flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--muted)}
.tabbar .on{color:var(--accent-ink)}

/* 카드 */
.card{background:var(--surface); border:2px solid var(--edge); border-radius:var(--r-lg); padding:16px; box-shadow:var(--shadow)}
.card.ok{border-color:var(--done)}
.card.red{border-color:var(--crit)}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:14px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap}
.chip.count{background:var(--surface); border:2px solid var(--edge); box-shadow:var(--shadow); font-size:17px; padding:8px 14px; align-self:flex-start}

/* 상태등: 색 + 모양 + 글자 */
.light{display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:700; padding:6px 10px; border-radius:999px; white-space:nowrap; flex:none}
.light.stable{background:var(--done-tint); color:var(--done-ink)}
.light.caution{background:var(--warn-tint); color:var(--warn-ink)}
.light.intervention{background:var(--crit-tint); color:var(--crit-ink)}

/* 버튼 */
.btn{min-height:48px; padding:0 16px; border-radius:var(--r-md); font-size:17px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; gap:6px}
.btn.block{width:100%}
.btn.pri{background:var(--accent); color:#fff; min-height:56px}
.btn.crit{background:var(--crit); color:#fff}
.btn.soft{background:var(--inset); color:var(--muted)}
.btn.line{background:var(--surface); border:2px solid var(--border-strong); color:var(--text)}
.btn.dash{border:2px dashed var(--border-strong); color:var(--muted); font-weight:700}
.btn.text{color:var(--muted); font-weight:600}

/* 하루 상태 표시 (#96) */
.mk{width:36px; height:36px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; flex:none}
.mk.sq{border-radius:10px}
.mk.done{background:var(--done); color:#fff}
.mk.over{background:var(--over); color:#fff}
.mk.partial{background:var(--surface); border:2px solid var(--done); color:var(--done-ink)}
.mk.skip{background:var(--inset); color:var(--muted)}
.mk.missed{background:var(--surface); border:2px solid var(--crit); color:var(--crit-ink)}
.mk.pending{background:var(--surface); border:2px dashed var(--border-strong); color:var(--muted)}
.mk.mini{width:22px; height:22px; font-size:14px}
.days{display:grid; grid-template-columns:repeat(7,1fr); align-items:start}
.day{display:flex; flex-direction:column; align-items:center; gap:2px; min-height:48px; font-size:14px; font-weight:700; color:var(--muted)}

/* 오늘 */
.habit{display:flex; align-items:center; gap:14px}
.hico{width:52px; height:52px; border-radius:var(--r-md); background:var(--accent-tint); display:flex; align-items:center; justify-content:center; font-size:28px; flex:none}
.bar{height:10px; border-radius:99px; background:var(--inset); margin-top:6px; overflow:hidden; position:relative}
.bar i{display:block; height:100%; border-radius:99px; background:var(--accent)}
.bar.ok i{background:var(--done)}
.act{width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; flex:none}
.act .ic{width:28px; height:28px; stroke-width:2.5}
.act.ok{background:var(--done)}
.okb{color:var(--done-ink)}
.banner{background:var(--warn-tint); color:var(--warn-ink); border-radius:var(--r-lg); padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.banner .btn{background:var(--surface); color:var(--warn-ink); border:2px solid var(--warn)}
.fold{background:var(--surface); border:2px solid var(--edge); border-radius:var(--r-md); min-height:56px; padding:0 16px; display:flex; align-items:center; justify-content:space-between; font-weight:700; color:var(--muted)}

/* 시트 · 모달 · 토스트 · 툴팁 · 축하 */
.scrim{position:absolute; inset:0; background:var(--scrim)}
.sheet{position:absolute; left:0; right:0; bottom:0; background:var(--surface); border-radius:28px 28px 0 0; padding:12px 20px 32px; display:flex; flex-direction:column; gap:12px}
.grab{width:40px; height:5px; border-radius:9px; background:var(--border); align-self:center}
.stepper{display:flex; align-items:center; justify-content:center; gap:20px; margin:8px 0}
.stepper button{width:56px; height:56px; border-radius:50%; background:var(--inset); font-size:28px; font-weight:700; color:var(--text)}
.field{min-height:56px; border-radius:var(--r-md); border:2px solid var(--border-strong); background:var(--surface); padding:12px 14px; color:var(--text); display:flex; align-items:center}
.field.ph{color:var(--muted)}
.toast{position:absolute; left:16px; right:16px; bottom:88px; background:var(--text); color:var(--surface); border-radius:var(--r-md); padding:12px 16px; display:flex; align-items:center; gap:12px}
.toast .undo{color:var(--surface); font-weight:800; text-decoration:underline; min-height:48px; padding:0 4px}
.tip{position:absolute; max-width:280px; background:var(--text); color:var(--surface); border-radius:var(--r-sm); padding:10px 12px; font-size:14px; font-weight:600; line-height:1.5; z-index:5}
.tip::before{content:""; position:absolute; top:-6px; left:var(--arrow,24px); border:6px solid transparent; border-top:0; border-bottom-color:var(--text)}
.celebrate{position:absolute; left:12px; right:12px; top:12px; background:var(--surface); border:2px solid var(--streak); border-radius:var(--r-lg); padding:14px 16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--lift)}
.fire{font-size:40px; line-height:1}
.wk{display:flex; gap:6px; justify-content:center}
.wk .day i{width:28px; height:28px; border-radius:50%; background:var(--inset); display:flex; align-items:center; justify-content:center; font-style:normal; color:#fff; font-size:14px}
.wk .day.on i{background:var(--streak)}
.wk .day.today{color:var(--streak-ink)}
.starline{background:var(--streak-tint); color:var(--streak-ink); border-radius:var(--r-sm); padding:8px 12px; font-size:14px; font-weight:700}
.popup{position:absolute; left:45px; right:45px; top:50%; transform:translateY(-50%); background:var(--surface); border-radius:28px; padding:24px 22px 20px; text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center}
.drain{height:4px; width:100%; border-radius:9px; background:var(--streak-tint); overflow:hidden; margin-top:8px}
.drain i{display:block; height:100%; width:60%; background:var(--streak)}
.confetti{position:absolute; font-size:22px}

/* 대시보드 */
.level{background:var(--accent); color:#fff; border-radius:var(--r-lg); padding:16px 18px; display:flex; flex-direction:column; gap:8px}
.level .q{color:#fff}
.lvbar{height:8px; border-radius:9px; background:rgba(255,255,255,.3); overflow:hidden}
.lvbar i{display:block; height:100%; background:#fff; border-radius:9px}
.streak{color:var(--streak-ink); font-weight:800; white-space:nowrap}
.statrow{display:flex; flex-direction:column; gap:6px; padding:12px 0; border-bottom:1px solid var(--border)}
.statrow:last-child{border:0}
.sbar{height:10px; border-radius:99px; background:var(--inset); overflow:hidden}
.sbar i{display:block; height:100%; background:var(--stat-ink); border-radius:99px}

/* 습관 상세 */
.ring{width:112px; height:112px; position:relative; flex:none}
.ring svg{display:block}
.ring .in{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.pills{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.pill{position:relative; background:var(--surface); border:2px solid var(--edge); border-radius:var(--r-md); padding:10px 8px 10px 12px; box-shadow:var(--shadow); white-space:nowrap}
.pill .q{position:static; width:24px}
.pill .q::after{inset:-2px}
.heat{display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:24px; grid-auto-rows:48px; justify-items:center; align-items:center; margin-top:6px}
.heat .mk{width:40px; height:40px; border-radius:10px}
.heat .hd{height:24px; align-self:end; font-size:14px; font-weight:700; color:var(--muted)}
.legend{display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:12px; font-size:14px; font-weight:700; color:var(--muted)}
.legend span{display:flex; align-items:center; gap:4px}
.drow{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); align-items:center}
.drow:last-of-type{border:0}
.drow .k{width:112px; color:var(--muted); font-size:14px; font-weight:700; display:flex; align-items:center; flex:none}
.drow .v{font-weight:600}
.bars{display:flex; align-items:flex-end; gap:6px; height:120px; margin-top:12px; position:relative}
.bars i{flex:1; border-radius:6px 6px 0 0; background:var(--accent-tint)}
.bars i.now{background:var(--accent)}
.bars .ln{position:absolute; left:0; right:0; border-top:2px dashed var(--border-strong); font-size:14px; font-weight:700; color:var(--muted); text-align:right; line-height:1; padding-top:2px}
.bars .ln.tg{border-color:var(--over); color:var(--done-ink)}
.jday{padding:12px 0; border-bottom:1px solid var(--border)}
.jday:last-of-type{border:0}
.st{display:inline-flex; align-items:center; gap:4px; font-size:14px; font-weight:700; padding:3px 10px; border-radius:999px}
.st.done{background:var(--done-tint); color:var(--done-ink)}
.st.over{background:var(--done-tint); color:var(--done-ink)}
.st.partial{background:var(--done-tint); color:var(--done-ink)}
.st.skip{background:var(--inset); color:var(--muted)}
.st.missed{background:var(--crit-tint); color:var(--crit-ink)}
.st.pending{background:var(--surface2); color:var(--muted)}
.menu{position:absolute; right:16px; top:68px; background:var(--surface); border:2px solid var(--edge); border-radius:var(--r-md); box-shadow:var(--lift); padding:6px; width:200px}
.menu button{display:flex; width:100%; min-height:48px; align-items:center; padding:0 14px; font-weight:700; border-radius:10px}

/* 글 모음 */
.chips{display:flex; gap:8px; overflow:hidden}
.fchip{min-height:48px; padding:0 16px; border-radius:999px; background:var(--surface); border:2px solid var(--border); font-weight:700; display:inline-flex; align-items:center; white-space:nowrap; flex:none}
.fchip.on{background:var(--accent); border-color:var(--accent); color:#fff}
.entry{display:flex; flex-direction:column; gap:4px; padding:12px 0; border-bottom:1px solid var(--border)}
.entry:last-child{border:0}

/* 새 습관 */
.flabel{display:flex; align-items:center; gap:4px; margin-bottom:2px; font-size:14px; font-weight:700; color:var(--muted)}
.opt{color:var(--muted); font-weight:600}
.seg{display:flex; background:var(--inset); border-radius:var(--r-md); padding:4px}
.seg button{flex:1; min-height:48px; border-radius:12px; font-weight:700; color:var(--muted)}
.seg .on{background:var(--surface); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.08)}
.pick{min-height:48px; padding:0 14px; border-radius:var(--r-md); border:2px solid var(--border); background:var(--surface); font-weight:700; display:inline-flex; align-items:center; gap:6px}
.pick.on{border-color:var(--accent); background:var(--accent-tint); color:var(--accent-ink)}

/* 회고 */
.recover{background:var(--surface); border:2px solid var(--border-strong); border-radius:var(--r-lg); padding:16px; display:flex; flex-direction:column; gap:10px}
.flag{background:var(--surface); border:2px solid var(--edge); border-left:6px solid var(--crit); border-radius:var(--r-md); padding:14px 16px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow)}
.evidence{background:var(--inset); border-radius:var(--r-sm); padding:10px 12px; color:var(--muted); font-size:17px}
.rec{border:2px solid var(--accent); background:var(--accent-tint); border-radius:var(--r-lg); padding:16px; display:flex; flex-direction:column; gap:10px}
.rec .field{border-color:var(--border-strong)}
.alts{display:flex; flex-wrap:wrap; gap:8px}
.alts .btn{background:var(--surface); border:2px solid var(--border); color:var(--muted); font-weight:700}
  </style>
</helmet>

<!-- 습관 상세: 🔴 손봐야 해요 (#94). 회고하기 버튼, 비어 있는 언제·어디서. 예·아니오 습관이라 최소량과 목표 줄이 없다. -->
<div class="screen" style="height:1380px">
  <div class="page">
    <div class="spread" style="margin:-8px -12px 0">
      <button class="iconbtn" aria-label="뒤로"><svg class="ic"><use href="#i-back"/></svg></button>
      <button class="iconbtn" aria-label="더 보기"><svg class="ic"><use href="#i-more"/></svg></button>
    </div>
    <div class="row"><div class="hico" style="width:56px;height:56px;font-size:30px">🧘</div><h1 class="t-display grow">명상</h1></div>
    <div class="row" style="gap:2px"><span class="light intervention">▲ 손봐야 해요</span><span class="q" aria-label="설명 보기"><svg class="ic"><use href="#i-help"/></svg></span></div>
    <button class="btn crit block">회고하기</button>
