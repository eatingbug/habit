<div class="app">
  <div class="rowline">
    <div><div class="eyebrow">홈 화면 · 길게 누르기</div><h2 class="sh">못 한 날 표시하기</h2></div>
  </div>

  <div class="quest">
    <div class="qtop">
      <span class="dot a"></span><span class="qname">독서</span>
      <span class="chip stat">지능</span>
      <span class="qcue">점심 먹고 10쪽</span>
    </div>
    <div class="qbottom">
      <span class="streak">🔥<span class="num">7</span></span>
      <span class="ribbon" aria-hidden="true">
        <span class="cell done"></span><span class="cell partial"></span><span class="cell done"></span><span class="cell blank"></span><span class="cell partial"></span><span class="cell done"></span><span class="cell done"></span><span class="cell partial"></span><span class="cell blank"></span><span class="cell done"></span><span class="cell partial"></span><span class="cell done"></span><span class="cell done"></span><span class="cell blank" style="outline:2px solid var(--accent); outline-offset:1px"></span>
      </span>
      <button class="btn ghost" type="button">+최소</button>
    </div>
    <div class="skiprow" style="padding-top:2px; border-top:1px solid var(--border); margin-top:2px">
      <span class="lbl">오늘 못 했어요 · 왜?</span>
      <button class="btn ghost" type="button">깜빡함</button>
      <button class="btn ghost" type="button">너무 힘듦</button>
      <button class="btn ghost" type="button">예외</button>
      <button class="btn ghost" type="button">안 내킴</button>
    </div>
  </div>

  <span class="hint">오늘 칸을 꾹 누르면 이유 버튼이 펼쳐집니다. 다른 화면으로 안 들어가고 <b style="color:var(--text)">두 번만 눌러</b> 끝나요.</span>

  <div class="designbox">
    <div class="dhead"><span class="eyebrow">이 이유가 알려 주는 것</span></div>
    <div class="drow"><span class="dk">깜빡함</span><span class="dv">언제 할지가 안 정해져 있어요</span></div>
    <div class="drow"><span class="dk">너무 힘듦</span><span class="dv">최소량이 너무 많아요</span></div>
    <div class="drow"><span class="dk">예외</span><span class="dv" style="color:var(--good)">아플 때 같은 날 — 실패로 안 셉니다</span></div>
    <div class="drow"><span class="dk">안 내킴</span><span class="dv">왜 하는지가 아직 안 와닿아요</span></div>
  </div>

  <div class="toast">
    <span class="rx">못 한 날로 기록 · 깜빡함</span>
    <button class="undo" type="button">실행취소</button>
  </div>
</div>
