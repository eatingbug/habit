<div class="app">
  <div class="rowline">
    <div><div class="eyebrow">너무 많이 벌였어요</div><h2 class="sh">두 개만 집중하기</h2></div>
    <span class="chip warnc">진행 중 <span class="num">5</span>개</span>
  </div>

  <div class="banner">
    <span class="dot a"></span>
    <span class="bx"><b>한꺼번에 5개를 하고 계세요.</b> 지금은 2개만 하고 나머지는 잠깐 쉬어 둘까요? 이 2개가 익숙해지면 다시 꺼내 드릴게요.</span>
  </div>

  <div class="eyebrow">계속할 습관 고르기</div>
  <div style="display:flex; flex-direction:column; gap:7px">
    <sc-for list="{{ habits }}" as="h" hint-placeholder-count="5">
      <button class="{{ h.cls }}" type="button" onClick="{{ h.toggle }}">
        <span class="box">{{ h.mark }}</span>
        <span style="display:flex; flex-direction:column; gap:2px; min-width:0">
          <span class="pn">{{ h.name }}</span>
          <span class="pd">{{ h.meta }}</span>
        </span>
        <span class="mm num" style="margin-left:auto; font-size:10.5px; color:var(--faint)">{{ h.reps }}</span>
      </button>
    </sc-for>
  </div>

  <div class="sheet">
    <div class="rowline">
      <span class="eyebrow">결과</span>
      <span class="num" style="font-size:11px; color:var(--muted)">{{ summary }}</span>
    </div>
    <div class="slotbar">
      <sc-for list="{{ slots }}" as="s" hint-placeholder-count="5">
        <i class="{{ s.cls }}"></i>
      </sc-for>
    </div>
    <div class="hint">{{ verdict }}</div>
  </div>

  <div class="banner" style="background:var(--surface-2); border-color:var(--border)">
    <span class="bx" style="color:var(--muted)">쉬어 두는 것뿐이에요. <b style="color:var(--text)">지우는 게 아닙니다.</b> 그동안 쌓은 기록도 이어 온 날수도 그대로 남아 있다가, 준비되면 그 자리에서 다시 시작합니다.</span>
  </div>

  <button class="btn pri block" type="button">{{ cta }}</button>
  <button class="btn ghost block" type="button">그냥 지금대로 할래요</button>
</div>
