<!-- 오늘: 연속이 오른 순간 (#97 #99). 위쪽 배너와 아래 실행취소 토스트. 토스트에는 연속을 쓰지 않는다. -->
<div class="screen" style="height:940px">
  <div class="page">
    <div>
      <div class="t-label muted">10월 10일 토요일</div>
      <h1 class="t-display">오늘 할 일</h1>
    </div>
    <span class="chip count">✅ 3개 중 2개 했어요</span>

    <div class="card habit ok">
      <div class="hico">📖</div>
      <div class="grow">
        <div class="t-title">독서 <span class="t-label okb">★ 목표까지 했어요</span></div>
        <div class="muted">🕐 자기 전, 침대 옆에서</div>
        <div class="b" style="margin-top:4px">30쪽 · 목표 30쪽</div>
        <div class="bar ok"><i style="width:100%"></i></div>
      </div>
      <button class="act ok" aria-label="독서 기록">✓</button>
    </div>

    <div class="card habit ok">
      <div class="hico">💪</div>
      <div class="grow">
        <div class="t-title">턱걸이 <span class="t-label okb">✓ 했어요</span></div>
        <div class="muted">🕐 출근 전, 문틀 바에서</div>
        <div class="b" style="margin-top:4px">5 / 5회</div>
        <div class="bar ok"><i style="width:100%"></i></div>
      </div>
      <button class="act ok" aria-label="턱걸이 기록">✓</button>
    </div>

    <div class="card habit">
      <div class="hico">🧘</div>
      <div class="grow">
        <div class="t-title">명상</div>
        <div class="b" style="margin-top:4px">아직이에요</div>
      </div>
      <button class="act" aria-label="명상 기록"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>

    <div class="fold">오늘 기록 3개 <svg class="ic"><use href="#i-down"/></svg></div>
    <button class="btn dash block"><svg class="ic"><use href="#i-pencil"/></svg>끄적이기</button>
  </div>
  <nav class="tabbar">
    <button class="on"><svg class="ic"><use href="#i-sun"/></svg><span class="t-label">오늘</span></button>
    <button><svg class="ic"><use href="#i-grid"/></svg><span class="t-label">대시보드</span></button>
    <button><svg class="ic"><use href="#i-notebook"/></svg><span class="t-label">글 모음</span></button>
  </nav>
  <div class="celebrate">
    <div class="row"><span class="fire">🔥</span><div><div class="t-title"><span style="color:var(--streak-ink)">3</span>일 연속!</div><div class="muted">📖 독서 오늘 몫을 채웠어요</div></div></div>
    <div class="wk"><div class="day"><i></i>일</div><div class="day"><i></i>월</div><div class="day"><i></i>화</div><div class="day"><i></i>수</div><div class="day on"><i>✓</i>목</div><div class="day on"><i>✓</i>금</div><div class="day on today"><i>✓</i>토</div></div>
    <div class="starline">★ 목표까지 넘겼어요 · 별 +12</div>
  </div>
  <div class="toast"><div class="grow"><div class="b">기록됨</div><div class="t-label" style="font-weight:600">+24쪽 · 별 +72</div></div><button class="undo">실행취소</button></div>
</div>
