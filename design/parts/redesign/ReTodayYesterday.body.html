<!-- 오늘: 어제 기록이 빈 습관 셋 (#135). 배너의 채우기를 눌러 목록 시트를 연 모습. 습관마다 했어요와 못 했어요. -->
<div class="screen" style="height:940px">
  <div class="page">
    <div>
      <div class="t-label muted">10월 10일 토요일</div>
      <h1 class="t-display">오늘 할 일</h1>
    </div>
    <span class="chip count">✅ 4개 중 1개 했어요</span>

    <div class="banner">
      <div class="row"><span class="grow b">🌙 어제 기록이 빈 습관 3개</span><span class="q" aria-label="설명 보기"><svg class="ic"><use href="#i-help"/></svg></span></div>
      <button class="btn block">채우기</button>
    </div>

    <div class="card habit">
      <div class="hico">📖</div>
      <div class="grow">
        <div class="t-title">독서</div>
        <div class="muted">🕐 자기 전, 침대 옆에서</div>
        <div class="prog"><span class="b">6 / 10쪽</span><div class="bar"><i style="width:60%"></i></div></div>
      </div>
      <button class="act" aria-label="독서 기록"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>

    <div class="card habit ok">
      <div class="hico">💪</div>
      <div class="grow">
        <div class="t-title">턱걸이 <span class="t-label okb">✓ 했어요</span></div>
        <div class="muted">🕐 출근 전, 문틀 바에서</div>
        <div class="prog"><span class="b">5 / 5회</span><div class="bar ok"><i style="width:100%"></i></div></div>
      </div>
      <button class="act ok" aria-label="턱걸이 기록">✓</button>
    </div>

    <div class="card habit">
      <div class="hico">🧘</div>
      <div class="grow">
        <div class="t-title">명상</div>
        <div class="prog"><span class="b">아직이에요</span></div>
      </div>
      <button class="act" aria-label="명상 기록"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>

    <div class="card habit">
      <div class="hico">🤸</div>
      <div class="grow">
        <div class="t-title">스트레칭</div>
        <div class="prog"><span class="b">아직이에요</span></div>
      </div>
      <button class="act" aria-label="스트레칭 기록"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>

    <div class="fold">오늘 기록 2개 <svg class="ic"><use href="#i-down"/></svg></div>
    <button class="btn dash block"><svg class="ic"><use href="#i-pencil"/></svg>끄적이기</button>
  </div>
  <nav class="tabbar">
    <button class="on"><svg class="ic"><use href="#i-sun"/></svg><span class="t-label">오늘</span></button>
    <button><svg class="ic"><use href="#i-grid"/></svg><span class="t-label">대시보드</span></button>
    <button><svg class="ic"><use href="#i-notebook"/></svg><span class="t-label">글 모음</span></button>
  </nav>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="spread">
      <div><div class="t-label muted">10월 9일 금요일</div><div class="t-title">어제 기록이 빈 습관</div></div>
      <button class="iconbtn" aria-label="닫기"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="t-title">📖 독서</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
      <button class="btn line">했어요</button>
      <button class="btn line">못 했어요</button>
    </div>
    <div class="t-title">🧘 명상</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
      <button class="btn line">했어요</button>
      <button class="btn line">못 했어요</button>
    </div>
    <div class="t-title">🤸 스트레칭</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
      <button class="btn line">했어요</button>
      <button class="btn line">못 했어요</button>
    </div>
  </div>
</div>
