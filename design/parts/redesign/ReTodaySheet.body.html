<!-- 오늘: 기록 시트 (#90 #91). 시각 바꾸기와 못 한 이유는 시트 안에 둔다. -->
<div class="screen" style="height:940px">
  <div class="page">
    <div>
      <div class="t-label muted">10월 10일 토요일</div>
      <h1 class="t-display">오늘 할 일</h1>
    </div>
    <span class="chip count">✅ 3개 중 1개 했어요</span>

    <div class="card habit">
      <div class="hico">📖</div>
      <div class="grow">
        <div class="t-title">독서</div>
        <div class="muted">🕐 자기 전, 침대 옆에서</div>
        <div class="b" style="margin-top:4px">6 / 10쪽</div>
        <div class="bar"><i style="width:60%"></i></div>
      </div>
      <button class="act" aria-label="독서 기록"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>

    <div class="card habit ok">
      <div class="hico">💪</div>
      <div class="grow">
        <div class="t-title">턱걸이 <span class="t-label okb">✓ 했어요</span></div>
        <div class="muted">🕐 출근 전, 문틀 바에서</div>
        <div class="b" style="margin-top:4px">5 / 5회</div>
        <div class="bar ok"><i style="width:100%"></i></div>
      </div>
      <button class="act ok" aria-label="턱걸이 기록">✓</button>
    </div>

    <div class="card habit">
      <div class="hico">🧘</div>
      <div class="grow">
        <div class="t-title">명상</div>
        <div class="b" style="margin-top:4px">아직이에요</div>
      </div>
      <button class="act" aria-label="명상 기록"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>

    <div class="fold">오늘 기록 2개 <svg class="ic"><use href="#i-down"/></svg></div>
    <button class="btn dash block"><svg class="ic"><use href="#i-pencil"/></svg>끄적이기</button>
  </div>
  <nav class="tabbar">
    <button class="on"><svg class="ic"><use href="#i-sun"/></svg><span class="t-label">오늘</span></button>
    <button><svg class="ic"><use href="#i-grid"/></svg><span class="t-label">대시보드</span></button>
    <button><svg class="ic"><use href="#i-notebook"/></svg><span class="t-label">글 모음</span></button>
  </nav>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="spread">
      <div class="t-title">📖 독서 <span class="t-label muted">지금 6쪽</span></div>
      <button class="iconbtn" aria-label="닫기"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="stepper"><button>−</button><span class="t-number">4<span class="t-title">쪽</span></span><button>+</button></div>
    <div class="b" style="text-align:center; color:var(--done-ink)">이걸로 오늘 몫을 채워요 ✓</div>
    <div style="display:flex; justify-content:center"><button class="btn soft">지금 14:20 · 시각 바꾸기</button></div>
    <div class="field ph">메모 (선택)</div>
    <button class="btn pri block">기록하기</button>
    <button class="btn text block">오늘 못 했어요 · 왜?</button>
  </div>
</div>
