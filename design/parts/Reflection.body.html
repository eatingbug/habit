<div class="app">
  <div class="rowline">
    <div style="display:flex; align-items:center; gap:8px">
      <span class="dot r"></span><h2 class="sh">명상 회고</h2>
    </div>
    <span class="chip">이번 주</span>
  </div>

  <div class="eyebrow">미러 — 이번 주 상태</div>
  <div class="mirror">
    <div class="mcell"><span class="mw">월</span><span class="mv done">✓</span></div>
    <div class="mcell"><span class="mw">화</span><span class="mv blank">–</span></div>
    <div class="mcell"><span class="mw">수</span><span class="mv done">✓</span></div>
    <div class="mcell"><span class="mw">목</span><span class="mv skip">✕</span></div>
    <div class="mcell"><span class="mw">금</span><span class="mv skip">✕</span></div>
    <div class="mcell"><span class="mw">토</span><span class="mv blank">–</span></div>
    <div class="mcell"><span class="mw">일</span><span class="mv blank">–</span></div>
  </div>

  <div class="eyebrow">진단</div>
  <div class="flag crit">
    <div class="fhd"><span class="badge crit">신호 · CUE</span><span class="dot r"></span></div>
    <div class="fmsg">신호(cue)가 없어요 — 습관이 안 붙는 가장 큰 이유일 수 있어요.</div>
    <div class="fev">최근 14일 완료율 40% · 신호(cue) 미설정</div>
  </div>
  <div class="flag warn">
    <div class="fhd"><span class="badge warn">신호 · CUE</span><span class="dot a"></span></div>
    <div class="fmsg">건너뛰기가 '깜빡함'에 몰려 있어요.</div>
    <div class="fev">28일간 '깜빡함' 건너뛰기 3회 (Rule 5)</div>
  </div>

  <div class="rec">
    <div class="rhd">✓ 추천: 신호 채우기</div>
    <div class="sub" style="font-size:11px">언제·어디서 할지 정하면 완료율이 오릅니다. 확인만 하면 돼요.</div>
    <div class="rin">예: “자기 전 양치 후, 침대 옆에서”</div>
    <div class="alts">
      <button class="btn ghost" type="button">바닥 낮추기</button>
      <button class="btn ghost" type="button">잠시 멈춤</button>
      <button class="btn ghost" type="button">유지</button>
    </div>
    <button class="btn pri block" type="button">적용하고 닫기</button>
  </div>
  <p class="footnote">모든 진단에는 근거가 함께 표시됩니다 — 무비판적 승인 방지.</p>
</div>
