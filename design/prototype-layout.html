<!doctype html>
<!--
  PROTOTYPE — 버려질 코드. 레이아웃 시안 (지도 #89).
  참고: Loop Habit Tracker(iSoron/uhabits)의 "습관 한 줄 + 최근 며칠 칸" 표, 마이루틴의 "주간 띠 + 신호등 + 이모지 도장".
  고정된 결정: A 톤(체크리스트, 깨끗한 컬러), 하단 탭 바(오늘/대시보드), ? 툴팁, 연속 축하(평소 배너, 5일째·10일마다 팝업).
  ?layout=1|2|3 또는 위쪽 바/←→ 로 전환. 데이터는 메모리에만 있다.
  1 Loop 표: 오늘 = 습관 × 최근 5일 표(칸을 눌러 기록), 대시보드 = 습관별 자리 잡기 링 + 4주 달력.
  2 마이루틴 하루: 오늘 = 7일 띠 + 신호등 + 도장 목록, 대시보드 = 도장 달력.
  3 섞기: 오늘 = 7일 띠 + A 카드, 대시보드 = Loop 표(7일) + 링.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE · 레이아웃 시안</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#E9EAEF;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;color:#15171F}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
  .phone{width:390px;max-width:100%;min-height:780px;margin:64px auto 40px;border-radius:32px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.15);background:#F4F6FB;display:flex;flex-direction:column}
  .page{flex:1;padding:24px 20px 24px}
  .date{font-size:15px;color:#6B7080;font-weight:600}
  h1{font-size:30px;margin:4px 0 16px;letter-spacing:-.02em}
  h2{font-size:18px;margin:22px 0 10px}
  .q{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:13px;font-weight:800;background:rgba(0,0,0,.08);color:rgba(0,0,0,.55);vertical-align:middle;margin-left:4px;flex:none}
  .pill{background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:4px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .row{display:flex;align-items:center;gap:8px}
  .save{background:#FFF4D6;border-radius:18px;padding:14px 16px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:14px;color:#6A4B00}
  .box{background:#fff;border-radius:22px;padding:16px;box-shadow:0 2px 8px rgba(30,40,80,.06);margin-bottom:12px}
  .muted{color:#6B7080;font-size:15px;font-weight:600}
  .cue{color:#8A90A0;font-size:14px;font-weight:600;margin-top:2px}

  /* 탭 바 */
  .tabbar{position:sticky;bottom:0;display:flex;background:#fff;border-top:1px solid #E6E8EF;padding:4px 0 8px}
  .tabbar button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:#9AA0AE}
  .tabbar button span{font-size:24px;filter:grayscale(1);opacity:.6}
  .tabbar button.on{color:#2F6BFF}
  .tabbar button.on span{filter:none;opacity:1}

  /* 자리 잡기 링 (Loop 의 습관 강도 자리) */
  .ring{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
  .ring>div{border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}

  /* 하루 칸: 상태마다 모양이 다르다(색만으로 구분하지 않는다) */
  .cell{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex:none}
  .cell.done,.cell.over{color:#fff}
  .cell.partial{border:3px solid;background:#fff}
  .cell.skip{background:#EEF0F5;color:#8A90A0;font-size:20px}
  .cell.missed{background:#FBE9E7;color:#D0574C}
  .cell.pending{border:3px dashed #C9CEDA;color:#9AA0AE;font-size:22px}
  .cell.future{background:transparent;color:#C9CEDA}

  /* 1 · Loop 표 */
  .tbl .hd,.tbl .tr{display:grid;grid-template-columns:1fr repeat(5,44px);gap:6px;align-items:center}
  .tbl .hd{font-size:13px;font-weight:800;color:#9AA0AE;text-align:center;padding:0 16px 8px}
  .tbl .hd .td{color:#2F6BFF}
  .tbl .tr{background:#fff;border-radius:20px;padding:12px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(30,40,80,.06)}
  .tbl .nm{display:flex;align-items:center;gap:10px;min-width:0}
  .tbl .nm b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbl.w7 .hd,.tbl.w7 .tr{grid-template-columns:1fr repeat(7,30px);gap:4px}
  .tbl.w7 .cell{width:30px;height:30px;font-size:12px}
  .tbl.w7 .cell.pending{border-width:2px;font-size:16px}
  .tbl.w7 .cell.partial{border-width:2px}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;font-weight:700;color:#6B7080;margin-top:6px}
  .legend span{display:flex;align-items:center;gap:4px}
  .legend .cell{width:20px;height:20px;font-size:10px;border-width:2px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
  .cal i{aspect-ratio:1;border-radius:7px;background:#EEF0F5;display:block}
  .cal .wdh{font-size:12px;font-weight:800;color:#9AA0AE;text-align:center}

  /* 2 · 마이루틴 하루 */
  .strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#fff;border-radius:22px;padding:10px 8px;margin-bottom:14px;box-shadow:0 2px 8px rgba(30,40,80,.06)}
  .strip button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:14px;font-size:13px;font-weight:700;color:#6B7080;min-height:64px}
  .strip button b{font-size:17px;color:#15171F}
  .strip button.on{background:#2F6BFF;color:#fff}
  .strip button.on b{color:#fff}
  .strip .lt{font-size:12px;line-height:1}
  .signal{display:flex;align-items:center;gap:14px}
  .signal .lights{display:flex;gap:6px;background:#2A2D38;padding:8px 10px;border-radius:999px}
  .signal .lights i{width:18px;height:18px;border-radius:50%;background:#4A4E5C;display:block}
  .signal .lights i.g{background:#2DBE7A;box-shadow:0 0 10px #2DBE7A}
  .signal .lights i.y{background:#F5B83D;box-shadow:0 0 10px #F5B83D}
  .signal .lights i.r{background:#E5534B;box-shadow:0 0 10px #E5534B}
  .signal .t{font-size:18px;font-weight:800}
  .stamp-row{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(30,40,80,.06)}
  .stamp-row .em{font-size:30px;width:44px;text-align:center}
  .stamp-row .mid{flex:1;min-width:0}
  .stamp-row .nm{font-size:18px;font-weight:800}
  .stamp{width:58px;height:58px;border-radius:50%;border:3px dashed #C9CEDA;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;color:#9AA0AE}
  .stamp.got{border:3px solid;transform:rotate(-12deg);background:#fff;animation:stampin .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes stampin{from{transform:scale(1.8) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
  .stamp.half{border:3px solid #F5B83D;font-size:15px;font-weight:800;color:#B07A10}
  .scal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .scal div{aspect-ratio:1;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#9AA0AE;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .scal div span{font-size:18px;line-height:1.1}
  .scal .wdh{background:none;box-shadow:none;aspect-ratio:auto;font-size:12px;font-weight:800}
  .badges{display:flex;gap:10px;overflow-x:auto}
  .badge{flex:none;width:84px;text-align:center;background:#fff;border-radius:18px;padding:12px 6px;font-size:13px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .badge span{font-size:30px;display:block}
  .badge.off{opacity:.4;filter:grayscale(1)}

  /* 3 · A 카드 */
  .card{background:#fff;border-radius:22px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(30,40,80,.06);border:2px solid transparent}
  .card.ok{border-color:#2DBE7A}
  .ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
  .card .mid{flex:1;min-width:0}
  .card .name{font-size:19px;font-weight:800}
  .bar{height:10px;border-radius:99px;background:#EEF0F5;margin-top:8px;overflow:hidden;position:relative}
  .bar i{display:block;height:100%;border-radius:99px}
  .bar b{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.25)}
  .act{width:56px;height:56px;border-radius:50%;font-size:28px;font-weight:800;color:#fff;flex:none}
  .okb{font-size:13px;font-weight:800;color:#2DBE7A}

  /* 시트, 모달, 토스트, 툴팁, 스위처 */
  .scrim{position:fixed;inset:0;background:rgba(20,20,30,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:390px;max-width:100%;background:#fff;border-radius:28px 28px 0 0;padding:24px 20px 40px;z-index:51;animation:up .25s}
  @keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
  .sheet h3{margin:0;font-size:22px;display:flex;align-items:center;gap:8px}
  .sheet .when{display:inline-block;background:#FFF4D6;color:#6A4B00;border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700;margin-top:8px}
  .stepper{display:flex;align-items:center;justify-content:center;gap:20px;margin:24px 0 8px}
  .stepper button{width:56px;height:56px;border-radius:50%;background:#F0F2F7;font-size:28px;font-weight:700}
  .stepper .n{font-size:48px;font-weight:800;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}
  .hintline{text-align:center;color:#6B7080;font-size:15px;font-weight:600;margin-bottom:20px}
  .go{width:100%;padding:18px;border-radius:18px;font-size:18px;font-weight:800;color:#fff}
  .skipb{width:100%;padding:14px;font-size:15px;color:#888;margin-top:6px}
  .modal{background:#fff;border-radius:24px;padding:24px;max-width:340px;width:100%}
  .modal h3{margin:0 0 12px;font-size:20px}
  .modal .chips{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .modal .chips button{padding:14px;border-radius:14px;background:#F2F3F7;font-size:16px;font-weight:600;text-align:left}
  .modal .cancel{width:100%;padding:12px;font-size:15px;color:#777}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1E1F26;color:#fff;padding:14px 20px;border-radius:16px;font-size:16px;font-weight:600;z-index:40;white-space:nowrap}
  .tip{position:fixed;z-index:70;max-width:260px;background:#1E1F26;color:#fff;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;display:none}
  .tip b{display:block;margin-bottom:2px}
  .switcher{position:fixed;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:999px;padding:6px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:14px}
  .switcher button{color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px}
  .switcher span{min-width:200px;text-align:center;font-weight:600}
  .switcher small{display:block;font-size:10px;opacity:.6;font-weight:500;letter-spacing:.08em}

  /* 연속 축하 (결정됨): 평소 배너, 기념일 팝업 */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:65}
  #fx .click{pointer-events:auto}
  .wk{display:flex;gap:6px;justify-content:center}
  .wk div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#B0A08A}
  .wk i{width:26px;height:26px;border-radius:50%;background:#F1EBE2;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:#fff}
  .wk .on i{background:#FF9600}
  .wk .today{color:#FF8A00}
  .wk .today i{animation:pop2 .5s .6s both}
  @keyframes pop2{0%{transform:scale(0);background:#F1EBE2}70%{transform:scale(1.3)}100%{transform:scale(1);background:#FF9600}}
  .bump{animation:bump .4s}
  @keyframes bump{50%{transform:scale(1.4)}}
  .pt{position:fixed;font-size:22px;left:0;top:0;animation:fly 1.1s cubic-bezier(.15,.7,.4,1) forwards}
  @keyframes fly{0%{transform:translate(var(--x),var(--y)) scale(.4);opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(1) rotate(var(--r));opacity:0}}
  .fx1{position:fixed;inset:0;background:rgba(20,20,30,.35);display:flex;align-items:center;justify-content:center}
  .fx1 .c{background:#fff;border-radius:28px;padding:24px 26px 20px;width:300px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:popin .45s cubic-bezier(.2,1.5,.4,1)}
  @keyframes popin{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .fl{font-size:64px;line-height:1;animation:flicker 1.2s ease-in-out infinite}
  @keyframes flicker{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.08) rotate(3deg)}}
  .fx1 .n{font-size:56px;font-weight:900;color:#FF8A00;line-height:1.1;display:inline-block}
  .fx1 .l,.fx3 .l{font-size:20px;font-weight:900;color:#3A2A10}
  .fx1 .s,.fx3 .s{font-size:15px;font-weight:600;color:#7A6040;margin:4px 0 14px}
  .fx1 .drain{height:4px;border-radius:9px;background:#FFE3C2;margin-top:16px;overflow:hidden}
  .fx1 .drain i{display:block;height:100%;background:#FF9600;animation:drain 3s linear forwards}
  @keyframes drain{from{width:100%}to{width:0}}
  .fx3{position:fixed;top:10px;left:50%;width:360px;max-width:calc(100% - 20px);background:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 12px 36px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px;animation:drop 3.4s cubic-bezier(.2,1.2,.4,1) forwards}
  @keyframes drop{0%{transform:translate(-50%,-140%)}12%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-140%)}}
  .fx3 .fl{font-size:40px}
  .fx3 .l b{color:#FF8A00;display:inline-block}
  .fx3 .s{margin:0}
</style>
</head>
<body>
<div id="root"></div>
<div id="tip" class="tip" role="tooltip"></div>
<div id="fx"></div>
<script>
// ── 데이터: 최근 7일(0 = 6일 전, 6 = 오늘). 오늘은 7월 8일 화요일 ───────────────
const DAYS = ['수','목','금','토','일','월','화'], DATES = [2,3,4,5,6,7,8], TODAY = 6;
const COLORS = { read:'#3B82F6', pullup:'#F97316', meditate:'#8B5CF6' };
// 하루 기록: amt(합), skip(사유가 있으면 못 함). 독서는 오늘 성공하면 5일째(기념일 팝업).
let S = {
  xp: 180,
  habits: [
    { id:'read', name:'독서', em:'📖', unit:'쪽', floor:10, target:15, cue:'자기 전 침대에서', base:30,
      days:[{amt:0},{amt:4},{amt:10},{amt:12},{amt:10},{amt:16},{amt:6}] },
    { id:'pullup', name:'턱걸이', em:'💪', unit:'회', floor:5, target:10, cue:'출근 전 철봉 앞에서', base:44,
      days:[{amt:5},{amt:6},{amt:0,skip:'시간이 없었어요'},{amt:5},{amt:7},{amt:5},{amt:5}] },
    { id:'meditate', name:'명상', em:'🧘', binary:true, floor:1, unit:'', cue:'아침 커피 마신 뒤', base:14,
      days:[{amt:1},{amt:1},{amt:1},{amt:1},{amt:1},{amt:0},{amt:0}] },
  ],
  tab:'today', day:TODAY, sheet:null, modal:null, toast:null,
};
const H = id => S.habits.find(h => h.id === id);
function st(h, i){
  const d = h.days[i];
  if (d.skip) return 'skip';
  if (h.target && d.amt >= h.target) return 'over';
  if (d.amt >= h.floor) return 'done';
  if (d.amt > 0) return 'partial';
  return i === TODAY ? 'pending' : 'missed';
}
const ok = (h, i) => ['done','over'].includes(st(h, i));
// 연속: 오늘이 아직이면(pending/partial) 어제부터 센다. 7일을 꽉 채우면 그 앞 기록이 있다고 친다.
function streak(h){
  let i = ok(h, TODAY) ? TODAY : TODAY - 1, n = 0;
  while (i >= 0 && ok(h, i)) { n++; i--; }
  return i < 0 ? n + 3 : n;
}
const formed = h => h.base + h.days.filter((_, i) => ok(h, i)).length;  // 성공한 날 누적
const doneCount = i => S.habits.filter(h => ok(h, i)).length;

// ── 설명 툴팁 ──────────────────────────────────────────────────────
const HELP = {
  floor: ['성공 기준', '이만큼만 하면 그날은 성공이에요. 일부러 아주 작게 잡아요.'],
  ring: ['자리 잡기', '습관이 자리 잡는 데 평균 66일 걸려요. 링은 지금까지 성공한 날이 66일에 얼마나 찼는지예요.'],
  streak: ['연속 🔥', '성공한 날이 며칠째 이어지는지예요.'],
  xp: ['별 ⭐', '기록하면 받는 점수예요. 성공 기준을 넘기면 많이, 보너스 목표를 넘기면 더 받아요.'],
  save: ['어제를 놓쳤을 때', '하루 놓치는 건 괜찮아요. 이틀 연속으로 놓치지 않는 게 중요해요. 어제 칸을 눌러 지금 채울 수도 있어요.'],
  cells: ['칸 보는 법', '색이 찬 동그라미는 성공, 테두리만 있으면 조금 함, ✕는 기록 없음, –는 쉰 날이에요. 점선은 아직 기록 전이에요.'],
  signal: ['오늘 신호등', '초록은 다 했어요, 노랑은 하는 중이에요, 빨강은 아직 시작 전이에요.'],
};
const q = k => `<button class="q" data-help="${k}" aria-label="설명 보기">?</button>`;
let tipFor = null;
function showTip(b){
  const [t, p] = HELP[b.dataset.help], el = document.getElementById('tip');
  el.innerHTML = `<b>${t}</b>${p}`; el.style.display = 'block';
  const r = b.getBoundingClientRect(), w = el.offsetWidth, hh = el.offsetHeight;
  el.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  el.style.top = (r.bottom + 8 + hh > innerHeight ? r.top - hh - 8 : r.bottom + 8) + 'px';
  tipFor = b;
}
function hideTip(){ document.getElementById('tip').style.display = 'none'; tipFor = null; }
document.addEventListener('mouseover', e => { const b = e.target.closest('[data-help]'); if (b && b !== tipFor) showTip(b); });
document.addEventListener('mouseout', e => { const b = e.target.closest('[data-help]'); if (b && !b.contains(e.relatedTarget)) hideTip(); });
addEventListener('scroll', hideTip, true);

// ── 기록 (메모리) ────────────────────────────────────────────────
function log(id, i, amount){
  const h = H(id), d = h.days[i], before = d.amt, after = before + amount;
  const crossed = before < h.floor && after >= h.floor;
  const streakBefore = streak(h);
  d.amt = after; delete d.skip;
  if (crossed) S.xp += 60;
  S.sheet = null;
  // 축하는 오늘 기록이 오늘 몫을 처음 넘길 때만(지난 날 채우기는 #97 남은 질문)
  if (crossed && i === TODAY) return { h, from: streakBefore, to: streak(h) };
  toast(i === TODAY ? (after < h.floor ? `기록했어요 · ${after}/${h.floor}${h.unit}` : '기록했어요')
    : `${DAYS[i]}요일 기록을 채웠어요${crossed ? ` · 🔥 ${streak(h)}일 연속` : ''}`);
}
function skip(id, i, reason){ const d = H(id).days[i]; d.amt = 0; d.skip = reason; S.modal = null; S.sheet = null; toast('괜찮아요. 내일 다시 해요'); }
function toast(m){ S.toast = m; clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 2200); }

// ── 공용 조각 ────────────────────────────────────────────────────
function ring(h, size){
  const pct = Math.min(100, formed(h) / 66 * 100), c = COLORS[h.id];
  return `<div class="ring" style="width:${size}px;height:${size}px;background:conic-gradient(${c} ${pct}%,#E8EBF2 0)"><div style="width:${size - 10}px;height:${size - 10}px;font-size:${size > 50 ? 16 : 11}px;color:${c}">${size > 50 ? `${formed(h)}일` : Math.round(pct) + '%'}</div></div>`;
}
function cell(h, i, tap = true){
  const s = st(h, i), c = COLORS[h.id], d = h.days[i];
  const label = { done: h.binary ? '✓' : d.amt, over: '⭐', partial: d.amt, skip: '–', missed: '✕', pending: '+' }[s];
  const style = s === 'done' || s === 'over' ? `background:${c}` : s === 'partial' ? `border-color:${c};color:${c}` : '';
  return `<button class="cell ${s}" style="${style}" ${tap ? `data-open="${h.id}" data-day="${i}"` : 'disabled'} aria-label="${h.name} ${DAYS[i]}요일">${label}</button>`;
}
function tabbar(){
  return `<nav class="tabbar">${[['today','📅','오늘'],['dash','📊','대시보드']].map(([k, em, l]) =>
    `<button class="${S.tab === k ? 'on' : ''}" data-tab="${k}"><span>${em}</span>${l}</button>`).join('')}</nav>`;
}
function saveBanner(){
  const m = H('meditate');
  return st(m, TODAY - 1) === 'missed' && !ok(m, TODAY) ? `<div class="save">🌙 <span style="flex:1">어제 명상을 놓쳤어요. 오늘 하면 이어져요.</span>${q('save')}</div>` : '';
}
function strip(){
  return `<div class="strip">${DAYS.map((d, i) => {
    const n = doneCount(i), all = S.habits.length;
    const lt = n === all ? '🟢' : n > 0 || S.habits.some(h => st(h, i) === 'partial') ? '🟡' : i === TODAY ? '⚪' : '🔴';
    return `<button class="${S.day === i ? 'on' : ''}" data-pick="${i}">${i === TODAY ? '오늘' : d}<b>${DATES[i]}</b><span class="lt">${lt}</span></button>`;
  }).join('')}</div>`;
}
function head(title){
  return `<div class="date">7월 ${DATES[S.day]}일 ${DAYS[S.day]}요일</div>
    <div class="row" style="justify-content:space-between;align-items:flex-end"><h1 style="margin-bottom:12px">${title}</h1><span class="pill">⭐ ${S.xp} ${q('xp')}</span></div>`;
}
function legend(){
  return `<div class="legend">
    <span><i class="cell done" style="background:#2DBE7A">✓</i>성공</span>
    <span><i class="cell partial" style="border-color:#2DBE7A;color:#2DBE7A">3</i>조금 함</span>
    <span><i class="cell missed">✕</i>기록 없음</span>
    <span><i class="cell skip">–</i>쉼</span></div>`;
}

// 4주 달력(월요일 시작). 마지막 줄이 이번 주(7/7 월 ~ 7/13 일). 창 밖 과거는 그럴듯한 가짜 값.
function calDays(){
  return Array.from({ length: 28 }, (_, k) => { const d = k - 14, idx = d - 2;
    return { label: d <= 0 ? 30 + d : d, idx: idx >= 0 && idx <= TODAY ? idx : null, future: idx > TODAY, k }; });
}
// ── 1 · Loop 표 ──────────────────────────────────────────────────
function L1today(){
  const cols = [6,5,4,3,2];
  return `${head('오늘 할 일')}${saveBanner()}
  <div class="tbl">
    <div class="hd"><span style="text-align:left">최근 5일 ${q('cells')}</span>${cols.map(i => `<span class="${i === TODAY ? 'td' : ''}">${i === TODAY ? '오늘' : DAYS[i]}</span>`).join('')}</div>
    ${S.habits.map(h => `<div class="tr"><div class="nm">${ring(h, 38)}<div style="min-width:0"><b style="color:${COLORS[h.id]}">${h.em} ${h.name}</b><div class="cue">🔥 ${streak(h)}일</div></div></div>${cols.map(i => cell(h, i)).join('')}</div>`).join('')}
  </div>
  <div class="muted" style="margin-top:6px">칸을 누르면 그날 기록을 남겨요. 링은 자리 잡기 ${q('ring')}</div>`;
}
function L1dash(){
  return `<div class="date">이번 달</div><h1>대시보드</h1>
  ${S.habits.map(h => `<div class="box">
    <div class="row" style="gap:14px">${ring(h, 64)}<div style="flex:1"><div style="font-size:19px;font-weight:800;color:${COLORS[h.id]}">${h.em} ${h.name}</div>
      <div class="muted">🔥 ${streak(h)}일 연속 · 자리 잡기 ${formed(h)}/66일 ${q('ring')}</div></div></div>
    <div class="cal">${['월','화','수','목','금','토','일'].map(d => `<span class="wdh">${d}</span>`).join('')}
      ${calDays().map(({ idx, future, k }) => { const s = future ? '' : idx != null ? st(h, idx) : (k * 7 + h.base) % 5 ? 'done' : 'missed';
        const bg = s === 'done' || s === 'over' ? COLORS[h.id] : s === 'partial' ? COLORS[h.id] + '66' : s === 'missed' ? '#FBE9E7' : '#EEF0F5';
        return `<i style="background:${bg}"></i>`; }).join('')}</div>
  </div>`).join('')}`;
}

// ── 2 · 마이루틴 하루 ─────────────────────────────────────────────
function L2today(){
  const i = S.day, n = doneCount(i), all = S.habits.length;
  const lights = n === all ? 'g' : n > 0 || S.habits.some(h => st(h, i) === 'partial') ? 'y' : 'r';
  return `${head(i === TODAY ? '오늘 루틴' : `${DAYS[i]}요일 루틴`)}${strip()}
  <div class="box signal"><div class="lights"><i class="${lights === 'r' ? 'r' : ''}"></i><i class="${lights === 'y' ? 'y' : ''}"></i><i class="${lights === 'g' ? 'g' : ''}"></i></div>
    <div><div class="t">${n === all ? '다 했어요!' : `${all}개 중 ${n}개 했어요`}</div><div class="muted">${i === TODAY ? '오늘' : '이 날'} 신호등 ${q('signal')}</div></div></div>
  ${i === TODAY ? saveBanner() : ''}
  ${S.habits.map(h => { const s = st(h, i), c = COLORS[h.id], d = h.days[i];
    const stamp = ok(h, i) ? `<div class="stamp got" style="border-color:${c}">${s === 'over' ? '🤩' : '😊'}</div>`
      : s === 'partial' ? `<div class="stamp half">${d.amt}/${h.floor}</div>` : s === 'skip' ? `<div class="stamp" style="border-style:solid">😴</div>`
      : `<div class="stamp">${i === TODAY ? '+' : '✕'}</div>`;
    return `<div class="stamp-row"><div class="em">${h.em}</div><div class="mid"><div class="nm">${h.name}</div>
      <div class="cue">${h.cue}</div><div class="muted" style="font-size:14px">${h.binary ? '한 번' : `${h.floor}${h.unit}면 성공`}</div></div>
      <button data-open="${h.id}" data-day="${i}" aria-label="${h.name} 기록">${stamp}</button></div>`; }).join('')}`;
}
function L2dash(){
  const stamps = ({ idx, future, k }) => { if (future) return '';
    const n = idx != null ? doneCount(idx) : (k * 3) % 4; return n === 3 ? '😊' : n === 2 ? '🙂' : n === 1 ? '😐' : idx === TODAY ? '' : '😶'; };
  return `<div class="date">7월</div><h1>대시보드</h1>
  <div class="box"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b style="font-size:17px">도장 달력</b><span class="muted">😊 다 함 · 🙂 2개 · 😐 1개</span></div>
    <div class="scal">${['월','화','수','목','금','토','일'].map(d => `<div class="wdh">${d}</div>`).join('')}
      ${calDays().map(c => `<div style="${c.idx === TODAY ? 'outline:2px solid #2F6BFF' : ''}"><span>${stamps(c)}</span>${c.label}</div>`).join('')}</div></div>
  <h2>습관별 연속</h2>
  ${S.habits.map(h => `<div class="stamp-row"><div class="em">${h.em}</div><div class="mid"><div class="nm">${h.name}</div><div class="muted">🔥 ${streak(h)}일 연속 ${q('streak')}</div></div>${ring(h, 52)}</div>`).join('')}
  <h2>배지</h2>
  <div class="badges"><div class="badge"><span>🔥</span>5일 연속</div><div class="badge"><span>📚</span>책 100쪽</div><div class="badge off"><span>🏆</span>30일 연속</div><div class="badge off"><span>🌱</span>66일 자리 잡기</div></div>`;
}

// ── 3 · 섞기 ─────────────────────────────────────────────────────
function L3today(){
  const i = S.day;
  return `${head(i === TODAY ? '오늘 할 일' : `${DAYS[i]}요일 기록`)}${strip()}${i === TODAY ? saveBanner() : ''}
  ${S.habits.map(h => { const c = COLORS[h.id], s = st(h, i), d = h.days[i];
    const pct = Math.min(100, d.amt / (h.target ?? h.floor) * 100);
    const meta = s === 'skip' ? '쉰 날' : h.binary ? (ok(h, i) ? '했어요' : i === TODAY ? '아직 안 했어요' : '기록 없음') : `${d.amt} / ${h.floor}${h.unit}`;
    return `<div class="card ${ok(h, i) ? 'ok' : ''}"><div class="ico" style="background:${c}1F">${h.em}</div>
      <div class="mid"><div class="name">${h.name} ${ok(h, i) ? '<span class="okb">✓ 성공</span>' : ''}</div><div class="cue">${h.cue}</div>
      <div class="muted" style="margin-top:2px">${meta}</div>
      ${h.binary ? '' : `<div class="bar"><i style="width:${pct}%;background:${c}"></i>${h.target ? `<b style="left:${h.floor / h.target * 100}%"></b>` : ''}</div>`}</div>
      <button class="act" style="background:${ok(h, i) ? '#2DBE7A' : c}" data-open="${h.id}" data-day="${i}" aria-label="${h.name} 기록">${ok(h, i) ? '✓' : '+'}</button></div>`; }).join('')}`;
}
function L3dash(){
  const cols = [0,1,2,3,4,5,6];
  return `<div class="date">최근 7일</div><h1>대시보드</h1>
  <div class="tbl w7">
    <div class="hd"><span style="text-align:left">습관 ${q('cells')}</span>${cols.map(i => `<span class="${i === TODAY ? 'td' : ''}">${i === TODAY ? '오늘' : DAYS[i]}</span>`).join('')}</div>
    ${S.habits.map(h => `<div class="tr"><div class="nm">${ring(h, 34)}<div style="min-width:0"><b style="color:${COLORS[h.id]};font-size:16px">${h.name}</b><div class="cue">🔥 ${streak(h)}일</div></div></div>${cols.map(i => cell(h, i)).join('')}</div>`).join('')}
  </div>${legend()}
  <div class="muted" style="margin-top:12px">링은 자리 잡기 ${q('ring')} · 칸을 누르면 그날 기록을 남겨요</div>`;
}

// ── 시트 / 모달 ──────────────────────────────────────────────────
function sheet(){
  if (!S.sheet) return '';
  const h = H(S.sheet.id), i = S.sheet.day, c = COLORS[h.id], d = h.days[i];
  const when = i === TODAY ? '' : `<span class="when">${DAYS[i]}요일 ${DATES[i]}일 기록 채우기</span>`;
  if (h.binary) return `<div class="scrim" data-close></div><div class="sheet"><h3>${h.em} ${h.name}</h3>${when}
    <div class="hintline" style="margin:24px 0">${i === TODAY ? '오늘' : '그날'} 했나요?</div>
    <button class="go" style="background:${c}" data-log="${h.id}" data-day="${i}" data-n="1">네, 했어요!</button>
    <button class="skipb" data-skipask="${h.id}" data-day="${i}">${i === TODAY ? '오늘은' : '그날은'} 못 했어요</button></div>`;
  const n = S.sheet.n, after = d.amt + n;
  const line = h.target && after >= h.target ? '보너스 목표까지 넘어요 ⭐' : after >= h.floor ? '이걸로 성공이에요 ✓' : `성공까지 ${h.floor - after}${h.unit} 남아요`;
  return `<div class="scrim" data-close></div><div class="sheet"><h3>${h.em} ${h.name} <span style="font-size:15px;color:#888;font-weight:600">지금 ${d.amt}${h.unit}</span></h3>${when}
    <div class="stepper"><button data-step="-1">−</button><span class="n">${n}<small style="font-size:20px">${h.unit}</small></span><button data-step="1">+</button></div>
    <div class="hintline">${line} ${q('floor')}</div>
    <button class="go" style="background:${c}" data-log="${h.id}" data-day="${i}" data-n="${n}">기록하기</button>
    <button class="skipb" data-skipask="${h.id}" data-day="${i}">${i === TODAY ? '오늘은' : '그날은'} 못 했어요</button></div>`;
}
function modal(){
  if (!S.modal) return '';
  const h = H(S.modal.id);
  return `<div class="scrim" data-close><div class="modal" onclick="event.stopPropagation()"><h3>${h.em} 못 한 이유</h3>
    <div class="chips">${['시간이 없었어요','깜빡했어요','너무 힘들었어요','쉬는 날이에요'].map(r => `<button data-skip="${h.id}" data-day="${S.modal.day}" data-reason="${r}">${r}</button>`).join('')}</div>
    <button class="cancel" data-close>취소</button></div></div>`;
}

// ── 연속 축하 (결정됨: 평소 배너, 5일째와 10일마다 팝업) ─────────────
function weekDots(to){
  return `<div class="wk">${DAYS.map((d, i) => `<div class="${i === TODAY ? 'today on' : i >= TODAY - (to - 1) ? 'on' : ''}"><i>${i >= TODAY - (to - 1) ? '✓' : ''}</i>${d}</div>`).join('')}</div>`;
}
function add(html){ const w = document.createElement('div'); w.innerHTML = html; const el = w.firstElementChild; document.getElementById('fx').append(el); return el; }
function burst(x, y, n, spread){
  const set = ['🎉','✨','🟧','🟨','🔥','⭐'];
  for (let k = 0; k < n; k++) { const a = Math.random() * Math.PI * 2, d = spread * (.5 + Math.random() * .7);
    const el = add(`<span class="pt">${set[k % set.length]}</span>`);
    el.style.cssText += `--x:${x - 11}px;--y:${y - 11}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;--r:${Math.random() * 360}deg`;
    setTimeout(() => el.remove(), 1200); }
}
function bumpNum(el, to, ms){ setTimeout(() => { if (!el.isConnected) return; el.textContent = to; el.classList.add('bump'); }, ms); }
function celebrate(c){
  const sub = `${c.h.em} ${c.h.name} 오늘 몫 완료`;
  if (c.to === 5 || c.to % 10 === 0) {
    const el = add(`<div class="fx1 click"><div class="c"><div class="fl">🔥</div><div><span class="n">${c.from}</span></div>
      <div class="l">일 연속 성공!</div><div class="s">${sub}</div>${weekDots(c.to)}<div class="drain"><i></i></div></div></div>`);
    el.addEventListener('click', () => el.remove());
    bumpNum(el.querySelector('.n'), c.to, 600);
    setTimeout(() => burst(innerWidth / 2, innerHeight / 2, 28, 200), 250);
    setTimeout(() => el.remove(), 3000);
  } else {
    const el = add(`<div class="fx3 click"><div class="row" style="gap:12px"><div class="fl">🔥</div><div><div class="l"><b>${c.from}</b>일 연속 성공!</div><div class="s">${sub}</div></div></div>${weekDots(c.to)}</div>`);
    el.addEventListener('click', () => el.remove());
    bumpNum(el.querySelector('b'), c.to, 700);
    setTimeout(() => burst(innerWidth / 2, 60, 18, 160), 300);
    setTimeout(() => el.remove(), 3400);
  }
}

// ── 렌더 + 스위처 ────────────────────────────────────────────────
const LAYOUTS = { 1:'Loop 표', 2:'마이루틴 하루', 3:'섞기 · 띠 + 카드 / 표' };
const LK = Object.keys(LAYOUTS);
function layout(){ const v = new URLSearchParams(location.search).get('layout'); return LK.includes(v) ? v : '1'; }
function setLayout(v){ const u = new URL(location); u.searchParams.set('layout', v); history.replaceState(null, '', u); S.sheet = S.modal = null; S.day = TODAY; render(); }
function render(){
  hideTip();
  const L = layout(), today = S.tab === 'today';
  const body = { 1: today ? L1today : L1dash, 2: today ? L2today : L2dash, 3: today ? L3today : L3dash }[L]();
  document.getElementById('root').innerHTML = `<div class="phone"><div class="page">${body}</div>${tabbar()}</div>`
    + sheet() + modal() + (S.toast ? `<div class="toast">${S.toast}</div>` : '')
    + `<div class="switcher"><button data-cycle="-1" aria-label="이전 시안">‹</button><span><small>PROTOTYPE · 레이아웃 · ←/→</small>${L} · ${LAYOUTS[L]}</span><button data-cycle="1" aria-label="다음 시안">›</button></div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-close]');
  if (!t?.dataset.help) hideTip();
  if (!t) return;
  const d = t.dataset;
  if (d.help) return showTip(t);
  if (d.cycle) { const k = LK.indexOf(layout()); return setLayout(LK[(k + +d.cycle + LK.length) % LK.length]); }
  if (d.tab) { S.tab = d.tab; S.day = TODAY; }
  else if (d.pick) S.day = +d.pick;
  else if (d.open) { const h = H(d.open), i = +d.day, dd = h.days[i];
    if (h.binary && ok(h, i)) { toast('이미 했어요 ✓'); }
    else S.sheet = { id: h.id, day: i, n: h.binary ? 1 : Math.max(1, h.floor - dd.amt) }; }
  else if (d.step) S.sheet.n = Math.max(1, S.sheet.n + +d.step);
  else if (d.log) { const c = log(d.log, +d.day, +d.n); render(); if (c) celebrate(c); return; }
  else if (d.skipask) { S.modal = { id: d.skipask, day: +d.day }; S.sheet = null; }
  else if (d.skip) skip(d.skip, +d.day, d.reason);
  else if (d.close !== undefined) { S.modal = null; S.sheet = null; }
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const k = LK.indexOf(layout()); setLayout(LK[(k + (e.key === 'ArrowLeft' ? -1 : 1) + LK.length) % LK.length]); }
  if (e.key === 'Escape') { hideTip(); S.modal = S.sheet = null; document.getElementById('fx').innerHTML = ''; render(); }
});
render();
</script>
</body>
</html>
