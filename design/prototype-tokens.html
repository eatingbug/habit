<!doctype html>
<!--
  PROTOTYPE — 버려질 코드. 색 토큰과 타입 스케일 (#96).
  질문: 라이트 팔레트 값과 글씨 크기 단계를 무엇으로 확정할까.
  같은 화면(오늘 카드, 대시보드 한 줄, 상세 pill, 시트)을 두고 질문별 스위치로 값을 바꿔 본다.
  ?preset=now|draft|pick 로 시작 프리셋을 고른다. 각 스위치는 프리셋 위에 덮어쓴다.
    now   = 지금 src/theme/tokens.ts
    draft = 시안(톤·레이아웃 프로토타입) 원래 색
    pick  = 추천안
  아래 대비 표는 지금 값으로 실시간 계산한다. 기준: 글자 4.5 하한·7 목표, 상태 표시 3.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE · 색과 글씨</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#E2E4EA;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
  .wrap{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:24px;flex-wrap:wrap}
  /* 조작판 (시안 아님) */
  .ctl{width:360px;background:#111;color:#eee;border-radius:20px;padding:18px;font-size:13px;position:sticky;top:24px}
  .ctl h2{font-size:15px;margin:0 0 10px}
  .ctl .grp{margin-bottom:14px}
  .ctl .t{font-weight:800;margin-bottom:6px;color:#fff}
  .ctl .opts{display:flex;flex-wrap:wrap;gap:6px}
  .ctl .opts button{padding:7px 10px;border-radius:999px;background:#2a2a2a;color:#ccc;font-size:12px;font-weight:700}
  .ctl .opts button.on{background:#2F6BFF;color:#fff}
  .ctl .d{color:#999;margin-top:4px;line-height:1.45}
  /* 폰: 모든 값은 변수 */
  .phone{width:390px;border-radius:32px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.15);background:var(--bg);color:var(--text);padding:24px 20px 28px}
  .num{font-variant-numeric:tabular-nums;font-family:var(--numfont)}
  .date{font-size:var(--label);font-weight:700;color:var(--muted)}
  h1{font-size:var(--display);margin:2px 0 14px;letter-spacing:-.02em;line-height:1.25}
  h3{font-size:var(--headline);margin:20px 0 10px;line-height:1.25}
  .q{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:13px;font-weight:800;background:var(--inset);color:var(--muted);margin-left:4px;vertical-align:middle}
  .banner{background:var(--warnTint);color:var(--warnInk);border-radius:var(--rmd);padding:14px 16px;font-size:var(--body);font-weight:700;line-height:1.5;margin-bottom:12px}
  .card{background:var(--surface);border-radius:var(--rlg);padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(30,40,80,.06);border:2px solid transparent}
  .card.ok{border-color:var(--doneFill)}
  .ico{width:52px;height:52px;border-radius:var(--rmd);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;background:var(--accentTint)}
  .card .mid{flex:1;min-width:0}
  .name{font-size:var(--title);font-weight:800;line-height:1.25}
  .cue{font-size:var(--label);font-weight:600;color:var(--muted);margin-top:2px}
  .prog{font-size:var(--body);font-weight:700;color:var(--muted);margin-top:4px}
  .bar{height:10px;border-radius:99px;background:var(--inset);margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--doneFill)}
  .act{width:var(--tap);height:var(--tap);border-radius:50%;font-size:26px;font-weight:800;color:#fff;background:var(--accentFill);flex:none}
  .okb{font-size:var(--label);font-weight:800;color:var(--doneInk)}
  .lvl{border-radius:var(--rlg);padding:16px 18px;color:#fff;display:flex;align-items:center;gap:14px;background:var(--lvlBg)}
  .lvl .lv{font-size:var(--headline);font-weight:900}
  .lvl .xp{font-size:var(--label);font-weight:700}
  .lvl .b{height:8px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:6px;overflow:hidden}
  .lvl .b i{display:block;width:62%;height:100%;background:#fff}
  .hrow{background:var(--surface);border-radius:var(--rlg);padding:14px 16px;margin-top:10px;box-shadow:0 2px 8px rgba(30,40,80,.06)}
  .hrow.red{border:2px solid var(--critTint)}
  .hrow .top{display:flex;align-items:center;gap:10px}
  .light{display:inline-flex;align-items:center;gap:5px;font-size:var(--label);font-weight:800;padding:5px 10px;border-radius:999px}
  .l-ok{background:var(--doneTint);color:var(--doneInk)}
  .l-warn{background:var(--warnTint);color:var(--warnInk)}
  .l-crit{background:var(--critTint);color:var(--critInk)}
  .hrow .nm{font-size:var(--title);font-weight:800;flex:1}
  .streak{font-size:var(--body);font-weight:800;color:var(--streakInk)}
  .dots{display:flex;gap:6px;margin-top:10px}
  .dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
  .d-done{background:var(--doneFill);color:#fff}
  .d-over{background:var(--overFill);color:#fff}
  .d-partial{background:var(--surface);border:2px solid var(--partialLine);color:var(--partialLine)}
  .d-skip{background:var(--inset);color:var(--muted)}
  .d-missed{background:var(--surface);border:2px solid var(--critFill);color:var(--critFill)}
  .d-pending{border:2px dashed var(--borderStrong);color:var(--muted)}
  .reflect{width:100%;min-height:var(--tap);margin-top:10px;border-radius:var(--rmd);background:var(--critFill);color:#fff;font-size:var(--body);font-weight:800}
  .pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pill{background:var(--surface);border-radius:var(--rmd);padding:12px}
  .pill .l{font-size:var(--label);font-weight:700;color:var(--muted)}
  .pill .v{font-size:var(--headline);font-weight:900}
  .pill .v.st{color:var(--streakInk)}
  .pill .v small{font-size:var(--label);color:var(--muted);margin-left:2px}
  .hero{background:var(--surface);border-radius:var(--rlg);padding:16px;margin-bottom:8px;display:flex;align-items:center;gap:16px}
  .hero .big{font-size:var(--number);font-weight:900;color:var(--streakInk);line-height:1}
  .hero .big small{font-size:var(--body);color:var(--text)}
  .fire{font-size:40px}
  .sheet{background:var(--surface);border-radius:var(--rlg) var(--rlg) 0 0;margin:16px -20px -28px;padding:20px;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
  .sheet .ttl{font-size:var(--title);font-weight:800}
  .stepper{display:flex;align-items:center;justify-content:center;gap:20px;margin:14px 0}
  .stepper button{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--inset);font-size:26px;font-weight:700;color:var(--text)}
  .stepper .n{font-size:var(--number);font-weight:800}
  .go{width:100%;min-height:var(--tap);border-radius:var(--rmd);background:var(--accentFill);color:#fff;font-size:var(--body);font-weight:800}
  .field{width:100%;min-height:var(--tap);border:2px solid var(--borderStrong);border-radius:var(--rsm);padding:0 12px;font-size:var(--body);display:flex;align-items:center;color:var(--faint);margin:10px 0}
  .tabbar{display:flex;background:var(--surface);border-radius:var(--rmd);margin-top:16px}
  .tabbar button{flex:1;min-height:var(--tap);font-size:var(--label);font-weight:700;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .tabbar button.on{color:var(--accentInk)}
  /* 대비 표 (시안 아님) */
  .tbl{width:420px;background:#fff;border-radius:20px;padding:18px;font-size:13px}
  .tbl h2{font-size:15px;margin:0 0 10px}
  .tbl table{width:100%;border-collapse:collapse}
  .tbl td{padding:6px 4px;border-bottom:1px solid #eee;vertical-align:middle}
  .sw{display:inline-block;width:56px;height:24px;border-radius:6px;text-align:center;line-height:24px;font-weight:800;font-size:12px}
  .bad{color:#B42318;font-weight:800}.mid{color:#9A6A00;font-weight:800}.good{color:#1E7A4B;font-weight:800}
  .tbl .note{color:#666;line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="ctl" id="ctl"></div>
  <div class="phone" id="phone"></div>
  <div class="tbl" id="tbl"></div>
</div>
<script>
// 색 세트. 지금 토큰엔 fill/ink 구분이 없어 같은 값을 쓴다.
const COLORS = {
  now: { bg:'#FBFBFC', surface:'#FFFFFF', inset:'#F0F0F4', border:'#E7E7EE', borderStrong:'#D9D9E1', text:'#1B1C20', faint:'#A2A4AE',
    accentFill:'#5A63D8', accentInk:'#4049C4', accentTint:'#EEEFFB',
    doneFill:'#3F9E72', doneInk:'#3F9E72', doneTint:'#E7F3ED', overFill:'#2C875C', partialLine:'#C08A2E',
    critFill:'#C25B54', critInk:'#C25B54', critTint:'#F7E6E5', warnInk:'#C08A2E', warnTint:'#F8F0E2',
    streakInk:'#C08A2E' },
  draft: { bg:'#F4F6FB', surface:'#FFFFFF', inset:'#EEF0F5', border:'#E6E8EF', borderStrong:'#C9CEDA', text:'#15171F', faint:'#9AA0AE',
    accentFill:'#2F6BFF', accentInk:'#2F6BFF', accentTint:'#E8F0FF',
    doneFill:'#2DBE7A', doneInk:'#1E8A55', doneTint:'#E3F6EC', overFill:'#16935A', partialLine:'#2DBE7A',
    critFill:'#E5534B', critInk:'#C2392E', critTint:'#FDE5E2', warnInk:'#9A6A00', warnTint:'#FFF1D1',
    streakInk:'#FF8A00' },
  pick: { bg:'#F4F6FB', surface:'#FFFFFF', inset:'#EEF0F5', border:'#E6E8EF', borderStrong:'#8A90A0', text:'#15171F', faint:'#9AA0AE',
    accentFill:'#2563EB', accentInk:'#1746B8', accentTint:'#E8F0FF',
    doneFill:'#1FA463', doneInk:'#0B6B3E', doneTint:'#E3F6EC', overFill:'#12804B', partialLine:'#1FA463',
    critFill:'#D93A30', critInk:'#A82A20', critTint:'#FDE5E2', warnInk:'#6A4B00', warnTint:'#FFF4D6',
    streakInk:'#8F4200' },
};
const MUTED = { now:'#6E7079', draft:'#6B7080', pick:'#4A4F60' };
const SCALES = {
  now:  { label:11, body:13.5, title:16, headline:20, display:28, number:28 },
  pick: { label:14, body:17, title:20, headline:24, display:30, number:44 },
};
const RADII = { now:{ sm:7, md:10, lg:10 }, pick:{ sm:12, md:16, lg:22 } };

const QS = [
  { k:'colors', t:'Q1·Q3 색 세트', d:'fill/ink/tint 구분 여부와 색상 값. 지금은 구분이 없다.', o:{ now:'지금 토큰', draft:'시안 원색', pick:'추천안' } },
  { k:'muted', t:'Q2 보조 글자', d:'계기, pill 이름, 진행 글자에 쓰인다.', o:{ now:'#6E7079', draft:'#6B7080', pick:'#4A4F60' } },
  { k:'lvl', t:'Q4 레벨 카드', d:'SPEC §6.0은 그라데이션을 금지한다.', o:{ grad:'그라데이션', solid:'accent 단색' } },
  { k:'scale', t:'Q5 글씨 단계', d:'지금 11/13.5/16/20/28 · 추천 14/17/20/24/30/44', o:{ now:'지금', pick:'추천안' } },
  { k:'num', t:'Q6 숫자 글꼴', d:'숫자에만 적용된다.', o:{ mono:'고정폭(Menlo)', sans:'일반 + tabular-nums' } },
  { k:'radius', t:'Q7 둥글기·탭 영역', d:'지금 7/10 · 44, 추천 12/16/22 · 48', o:{ now:'지금', pick:'추천안' } },
];
const PRESETS = {
  now:   { colors:'now', muted:'now', lvl:'solid', scale:'now', num:'mono', radius:'now' },
  draft: { colors:'draft', muted:'draft', lvl:'grad', scale:'pick', num:'sans', radius:'pick' },
  pick:  { colors:'pick', muted:'pick', lvl:'solid', scale:'pick', num:'sans', radius:'pick' },
};
const params = new URLSearchParams(location.search);
let preset = PRESETS[params.get('preset')] ? params.get('preset') : 'pick';
let s = { ...PRESETS[preset] };
for (const q of QS) if (params.get(q.k) && q.o[params.get(q.k)]) s[q.k] = params.get(q.k);
if (!params.get("preset")) preset = Object.keys(PRESETS).find((p) => QS.every((q) => PRESETS[p][q.k] === s[q.k])) ?? "";

function vars() {
  const c = { ...COLORS[s.colors], muted: MUTED[s.muted] };
  const sc = SCALES[s.scale], r = RADII[s.radius];
  const v = { ...c,
    label: sc.label + 'px', body: sc.body + 'px', title: sc.title + 'px', headline: sc.headline + 'px', display: sc.display + 'px', number: sc.number + 'px',
    rsm: r.sm + 'px', rmd: r.md + 'px', rlg: r.lg + 'px', tap: (s.radius === 'pick' ? 48 : 44) + 'px',
    numfont: s.num === 'mono' ? 'Menlo, ui-monospace, monospace' : 'inherit',
    lvlBg: s.lvl === 'grad' ? 'linear-gradient(135deg,#2F6BFF,#7C5CFF)' : c.accentFill,
  };
  const el = document.getElementById('phone');
  for (const [k, val] of Object.entries(v)) el.style.setProperty('--' + k, val);
  return c;
}

function phone() {
  return `
  <div class="date">10월 10일 금요일</div>
  <h1>오늘 <span class="num">2</span>개 중 <span class="num">1</span>개 했어요</h1>
  <div class="banner">어제 명상 기록을 놓쳤어요. 오늘 한 번이면 흐름이 이어져요.</div>
  <div class="card ok"><div class="ico">📖</div><div class="mid"><div class="name">독서</div><div class="cue">자기 전, 침대 옆에서</div>
    <div class="prog num">12 / 10쪽</div><div class="bar"><i style="width:100%"></i></div></div><span class="okb">✓ 했어요</span></div>
  <div class="card"><div class="ico">🧘</div><div class="mid"><div class="name">명상</div><div class="cue">아침 커피 전에</div>
    <div class="prog num">0 / 5분</div><div class="bar"><i style="width:0"></i></div></div><button class="act">+</button></div>

  <h3>대시보드</h3>
  <div class="lvl"><div class="lv num">Lv 7</div><div style="flex:1"><div class="xp num">다음 레벨까지 별 120개</div><div class="b"><i></i></div></div></div>
  <div class="hrow red"><div class="top"><span class="light l-crit">▲ 손봐야 해요</span><span class="nm">명상</span><span class="streak num">🔥 0일</span></div>
    <div class="dots">${['missed','skip','partial','missed','done','missed','pending'].map(dot).join('')}</div>
    <button class="reflect">회고하기</button></div>
  <div class="hrow"><div class="top"><span class="light l-warn">◆ 살펴보세요</span><span class="nm">물 마시기</span><span class="streak num">🔥 3일</span></div>
    <div class="dots">${['done','partial','done','skip','done','done','pending'].map(dot).join('')}</div></div>
  <div class="hrow"><div class="top"><span class="light l-ok">● 괜찮아요</span><span class="nm">독서</span><span class="streak num">🔥 12일</span></div>
    <div class="dots">${['done','over','done','done','partial','done','done'].map(dot).join('')}</div></div>

  <h3>습관 상세</h3>
  <div class="hero"><span class="fire">🔥</span><div><div class="cue">연속<span class="q">?</span></div><div class="big num">12<small>일</small></div></div></div>
  <div class="pills">
    <div class="pill"><div class="l">연속</div><div class="v st num">12<small>일</small></div></div>
    <div class="pill"><div class="l">최고 연속</div><div class="v num">20<small>일</small></div></div>
    <div class="pill"><div class="l">성공률</div><div class="v num">86<small>%</small></div></div></div>

  <div class="sheet"><div class="ttl">독서 기록</div>
    <div class="stepper"><button>−</button><span class="n num">10</span><button>+</button></div>
    <div class="field">메모 (선택)</div>
    <button class="go">기록하기</button>
    <div class="tabbar"><button class="on"><span style="font-size:22px">✅</span>오늘</button><button><span style="font-size:22px;filter:grayscale(1)">📊</span>대시보드</button></div>
  </div>`;
}
const MK = { done:'✓', over:'★', partial:'½', skip:'−', missed:'!', pending:'' };
const dot = (st) => `<span class="dot d-${st}">${MK[st]}</span>`;

// 대비 계산
const lum = (h) => { const c = h.match(/\w\w/g).map((x) => parseInt(x, 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4)); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
const cr = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
function table(c) {
  const rows = [
    ['본문', c.text, c.bg, 'text'], ['보조 글자', c.muted, c.bg, 'text'], ['보조 글자 (카드 위)', c.muted, c.surface, 'text'],
    ['비활성 탭 라벨', c.faint, c.surface, 'text'],
    ['주 버튼 흰 글자', '#FFFFFF', c.accentFill, 'text'], ['켜진 탭 라벨', c.accentInk, c.surface, 'text'],
    ['했어요 점 (흰 ✓)', '#FFFFFF', c.doneFill, 'ui'], ['했어요 점 vs 카드', c.doneFill, c.surface, 'ui'],
    ['괜찮아요 칩 글자', c.doneInk, c.doneTint, 'text'], ['조금 했어요 테두리', c.partialLine, c.surface, 'ui'],
    ['회고하기 흰 글자', '#FFFFFF', c.critFill, 'text'], ['손봐야 해요 칩 글자', c.critInk, c.critTint, 'text'],
    ['살펴보세요 칩 글자', c.warnInk, c.warnTint, 'text'], ['연속 숫자', c.streakInk, c.surface, 'text'],
    ['입력칸 테두리', c.borderStrong, c.surface, 'ui'], ['오늘 점선', c.borderStrong, c.surface, 'ui'],
  ];
  const grade = (v, kind) => kind === 'ui'
    ? (v >= 3 ? ['good', '통과'] : ['bad', '미달'])
    : (v >= 7 ? ['good', '목표'] : v >= 4.5 ? ['mid', '하한'] : ['bad', '미달']);
  return `<h2>대비 (지금 고른 값)</h2><table>${rows.map(([n, f, b, k]) => {
    const v = cr(f, b), [g, w] = grade(v, k);
    return `<tr><td>${n}</td><td><span class="sw" style="color:${f};background:${b};${k === 'ui' ? `border:2px solid ${f}` : ''}">가1</span></td>
      <td style="font-variant-numeric:tabular-nums">${v.toFixed(2)}</td><td class="${g}">${w}</td></tr>`;
  }).join('')}</table>
  <div class="note">글자: 7 이상 목표, 4.5 이상 하한. 상태 표시와 경계(ui): 3 이상.<br>큰 글자(24px, 굵은 18.7px 이상)는 3이 하한이지만 이 표는 엄격한 쪽으로 본다.</div>`;
}

function ctl() {
  return `<h2>질문별 스위치</h2>
    <div class="grp"><div class="t">프리셋</div><div class="opts">${Object.entries({ now:'지금 토큰', draft:'시안 원래', pick:'추천안' }).map(([k, v]) =>
      `<button class="${preset === k ? 'on' : ''}" onclick="usePreset('${k}')">${v}</button>`).join('')}</div></div>
    ${QS.map((q) => `<div class="grp"><div class="t">${q.t}</div><div class="opts">${Object.entries(q.o).map(([k, v]) =>
      `<button class="${s[q.k] === k ? 'on' : ''}" onclick="set('${q.k}','${k}')">${v}</button>`).join('')}</div><div class="d">${q.d}</div></div>`).join('')}`;
}
function usePreset(p) { preset = p; s = { ...PRESETS[p] }; render(); }
function set(k, v) { s[k] = v; preset = Object.keys(PRESETS).find((p) => QS.every((q) => PRESETS[p][q.k] === s[q.k])) ?? ''; render(); }
function render() {
  document.getElementById('phone').innerHTML = phone();
  const c = vars();
  document.getElementById('tbl').innerHTML = table(c);
  document.getElementById('ctl').innerHTML = ctl();
  history.replaceState(null, '', '?' + new URLSearchParams(preset ? { preset } : s));
}
render();
</script>
</body>
</html>
